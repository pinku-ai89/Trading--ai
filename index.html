<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d18">
<title>Trader Pink AI 📈</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d18;color:#fff;
 font-family:Arial,sans-serif;text-align:center
}
.app{max-width:330px;margin:auto;padding:10px}
.card{
 background:#111a2b;border-radius:18px;
 padding:14px;margin:8px 0;
 box-shadow:0 4px 15px #0005
}
h2{margin:3px 0;font-size:21px}
.sub{color:#9da9bd;font-size:13px}
.market{margin:10px 0;color:#b8c4d8}
.signal{
 font-size:42px;font-weight:bold;margin:6px
}
.buy{color:#00e676}
.sell{color:#ff5252}
.wait{color:#ffd740}
.conf{font-size:24px;font-weight:bold}
.time{font-size:13px;color:#9da9bd;margin:5px}
.trend{font-size:15px;margin:6px}
.sr{font-size:14px;margin:8px 0}
button{
 border:0;border-radius:10px;padding:10px 16px;
 margin:5px;font-weight:bold;background:#263653;color:white
}
.next{
 width:80px;height:80px;border-radius:50%;
 font-size:14px;padding:5px
}
.error{color:#ff5252;font-size:13px}
</style>
</head>

<body>
<div class="app">

<div class="card">

<h2>🤖 Trader Pink AI</h2>
<div class="sub">EUR/USD Smart 1 Minute Signal</div>

<div class="market">EURUSD • 1M</div>

<div id="count">--:--</div>

<div id="signal" class="signal wait">WAIT</div>

<div id="confidence" class="conf">--%</div>

<div id="trend" class="trend">--</div>

<div id="candle" class="time">Candle: --</div>

<div id="closed" class="time">--</div>

<div id="sr" class="sr"></div>

<div id="status">Analysis loading...</div>

<button onclick="update(true)">🔍 UPDATE</button>

<br>

<button class="next" onclick="update(true)">
◯<br>NEXT
</button>

</div>

</div>

<script>
const API="https://crimson-grass-f881.bijondebnath51.workers.dev/";

let nextTime=0;
let loading=false;

function $(id){
 return document.getElementById(id);
}

function time(t){
 if(!t)return"--";
 return new Date(t).toLocaleTimeString("en-GB",{
  timeZone:"Asia/Dhaka",
  hour:"2-digit",
  minute:"2-digit",
  second:"2-digit"
 });
}

async function update(manual=false){

 if(loading)return;
 loading=true;

 try{

  $("status").textContent="Analyzing...";

  const r=await fetch(
   API+"?t="+Date.now(),
   {cache:"no-store"}
  );

  const d=await r.json();

  if(!d.ok)throw Error(d.error||"No data");

  const s=d.signal||"WAIT";

  $("signal").textContent=s;

  $("signal").className=
   "signal "+
   (s==="BUY"?"buy":
    s==="SELL"?"sell":"wait");

  $("confidence").textContent=
   (d.confidence??"--")+"%";

  $("trend").textContent=
   d.trend||
   (d.candle?.direction==="UP"
    ?"📈 UPTREND"
    :d.candle?.direction==="DOWN"
    ?"📉 DOWNTREND"
    :"↔️ SIDEWAYS");

  $("candle").textContent=
   "Candle: "+
   (d.candle?.direction||"--")+
   " • "+
   (d.candle?.body_percent??"--")+"%";

  $("closed").textContent=
   "Signal: "+time(d.closed_candle_time);

  let sr="";

  if(d.support_status==="GOOD_SUPPORT")
   sr="🟢 ভালো SUPPORT আছে";

  if(d.resistance_status==="GOOD_RESISTANCE")
   sr+=(sr?"<br>":"")+"🔴 ভালো RESISTANCE আছে";

  $("sr").innerHTML=sr;

  $("status").textContent=
   s==="BUY"?"🟢 BUY confirmation":
   s==="SELL"?"🔴 SELL confirmation":
   "🟡 WAIT • Confirmation দুর্বল";

  nextTime=
   Number(d.next_candle||0)*1000;

 }catch(e){

  $("status").innerHTML=
   '<span class="error">⚠ '+e.message+"</span>";

 }finally{

  loading=false;
 }
}

function countdown(){

 if(!nextTime)return;

 let n=Math.max(
  0,
  Math.floor((nextTime-Date.now())/1000)
 );

 $("count").textContent=
  String(Math.floor(n/60)).padStart(2,"0")+
  ":"+
  String(n%60).padStart(2,"0");

 if(n<=1)update();
}

update(true);

setInterval(countdown,1000);
setInterval(()=>update(),10000);
</script>

</body>
</html>
