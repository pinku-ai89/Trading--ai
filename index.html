<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trader Pink AI 🤖📈</title>
<style>
*{box-sizing:border-box}body{
margin:0;background:#0b1020;color:#fff;font-family:Arial;
display:flex;justify-content:center;padding:15px
}.app{width:100%;max-width:360px;background:#151b2e;
padding:18px;border-radius:20px;text-align:center}
h2{margin:5px}.market{opacity:.8;margin-bottom:12px}
.signal{font-size:38px;font-weight:bold;margin:15px}
.info{margin:9px 0}.box{
background:#202941;padding:10px;border-radius:12px;margin:8px 0
}
button{width:100%;padding:13px;border:0;border-radius:12px;
background:#ff4f9a;color:white;font-size:16px;font-weight:bold}
</style>
</head>

<body>
<div class="app">
<h2>🤖 Trader Pink AI 📈</h2>
<div class="market">EURUSD • 1 MIN</div>

<div>পরের Candle শুরু হতে</div>
<div id="count" class="signal">--:--</div>

<div class="box">
<div>NEXT CANDLE SIGNAL</div>
<div id="signal" class="signal">WAIT</div>
<div>Confidence: <b id="confidence">0%</b></div>
</div>

<div class="box">
<div>Trend: <b id="trend">--</b></div>
<div>Candle: <b id="direction">--</b></div>
<div>Body: <b id="body">--</b></div>
</div>

<div class="box">
<div>Signal Candle</div>
<div id="closed">--</div>
<div>Next Candle</div>
<div id="next">--</div>
</div>

<button onclick="load()">🔄 UPDATE SIGNAL</button>
</div>

<script>
const API="https://crimson-grass-f881.bijondebnath51.workers.dev/";

async function load(){
 try{
  let r=await fetch(API+"?t="+Date.now());
  let d=await r.json();

  signal.textContent=d.signal||"WAIT";
  confidence.textContent=(d.confidence||0)+"%";
  trend.textContent=d.trend||"--";
  direction.textContent=d.candle?.direction||"--";
  body.textContent=(d.candle?.body_percent||0)+"%";
  closed.textContent=format(d.closed_candle_time);
  next.textContent=format(d.next_candle_time);
 }catch(e){
  signal.textContent="WAIT";
 }
}

function format(x){
 if(!x)return"--";
 return new Date(x).toLocaleString("en-GB",{
  timeZone:"Asia/Dhaka",hour12:false
 });
}

function timer(){
 let n=new Date();
 let s=60-n.getSeconds();
 count.textContent="00:"+String(s).padStart(2,"0");
 if(s===60||s===1)load();
}
load();
setInterval(timer,1000);
setInterval(load,10000);
</script>
</body>
</html>
