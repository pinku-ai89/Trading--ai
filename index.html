<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trader Pink AI 📈</title>

<meta name="theme-color" content="#ff4f9a">
<meta name="description" content="Trader Pink AI - Smart Forex and Binary Trading Signal Assistant">

<link rel="manifest" href="./manifest.json">

<link rel="icon"
      type="image/jpeg"
      href="./CompressJPEG.Online_img(512x512).jpg">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#16051a,#090909);
  color:#fff;
  min-height:100vh;
}

.app{
  max-width:600px;
  margin:auto;
  padding:16px;
}

.header{
  text-align:center;
  padding:18px 5px;
}

.app-icon{
  width:80px;
  height:80px;
  border-radius:20px;
  object-fit:cover;
  display:block;
  margin:0 auto 10px;
}

h1{
  margin:5px 0;
  color:#ff4f9a;
  font-size:28px;
}

.sub{
  color:#bbb;
  font-size:14px;
}

.status{
  text-align:center;
  color:#21e6a3;
  background:#151515;
  border:1px solid #292929;
  border-radius:12px;
  padding:10px;
  margin:10px 0;
  font-size:13px;
}

.card{
  background:#171717;
  border:1px solid #333;
  border-radius:18px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 8px 25px #0007;
}

.label{
  color:#aaa;
  font-size:13px;
  margin-bottom:8px;
}

select,
button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:16px;
}

select{
  background:#252525;
  color:#fff;
  border:1px solid #444;
}

.tf{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.tf button{
  background:#292929;
  color:#fff;
  border:1px solid #444;
}

.tf button.active{
  background:#ff4f9a;
  border-color:#ff4f9a;
}

.analyze{
  margin-top:14px;
  background:linear-gradient(90deg,#ff4f9a,#ff78b3);
  color:#fff;
  font-weight:bold;
}

.results-btn{
  margin-top:8px;
  background:#252525;
  color:#fff;
  border:1px solid #444;
}

.best{
  text-align:center;
  padding:18px;
  border-radius:16px;
  background:#202020;
}

.best-title{
  font-size:13px;
  color:#aaa;
}

.best-market{
  color:#ff4f9a;
  font-size:18px;
  font-weight:bold;
  margin-top:5px;
}

.best-signal{
  font-size:40px;
  font-weight:bold;
  margin:8px 0;
}

.signal-box{
  background:#202020;
  border:1px solid #333;
  border-radius:15px;
  padding:14px;
  margin:10px 0;
}

.signal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.signal-market{
  color:#ff4f9a;
  font-size:16px;
  font-weight:bold;
}

.signal-timeframe{
  color:#fff;
  font-size:17px;
  font-weight:bold;
}

.signal-main{
  text-align:center;
  padding:8px 0;
}

.signal-direction{
  font-size:30px;
  font-weight:bold;
}

.signal-confidence{
  color:#ddd;
  font-size:14px;
  margin-top:4px;
}

.candle{
  text-align:center;
  color:#aaa;
  font-size:12px;
  margin-top:8px;
}

.buy{
  color:#21e6a3;
}

.sell{
  color:#ff5c72;
}

.wait{
  color:#ffd166;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.item{
  background:#222;
  border-radius:12px;
  padding:12px;
}

.item small{
  display:block;
  color:#999;
  margin-bottom:5px;
  font-size:11px;
}

.item b{
  font-size:14px;
  word-break:break-word;
}

.section-title{
  font-size:18px;
  margin:4px 0 12px;
}

.market-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.market-header h2{
  margin:0;
  font-size:21px;
}

.price{
  color:#21e6a3;
  font-weight:bold;
  font-size:15px;
}

.reason{
  color:#ddd;
  line-height:1.6;
  font-size:14px;
}

.prediction{
  background:#222;
  padding:10px;
  border-radius:10px;
  margin:6px 0;
  color:#ddd;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.summary-box{
  background:#222;
  border-radius:12px;
  padding:12px 5px;
  text-align:center;
}

.summary-box span{
  display:block;
  color:#999;
  font-size:11px;
  margin-bottom:5px;
}

.summary-box strong{
  font-size:18px;
}

.loading{
  text-align:center;
  padding:18px;
  color:#aaa;
}

.error{
  color:#ff5c72;
  text-align:center;
  padding:12px;
  line-height:1.5;
}

.footer{
  text-align:center;
  color:#777;
  font-size:11px;
  padding:20px 0;
  line-height:1.6;
}

.analysis-tag{
  display:inline-block;
  background:#292929;
  border-radius:8px;
  padding:5px 8px;
  margin:3px;
  font-size:11px;
  color:#ccc;
}

.signal-note{
  text-align:center;
  color:#aaa;
  font-size:12px;
  margin-top:10px;
  line-height:1.5;
}

.countdown{
  text-align:center;
  color:#ff4f9a;
  font-weight:bold;
  font-size:13px;
  margin-top:8px;
}

</style>
</head>
