<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trader Pink AI 📈</title>

  <meta name="theme-color" content="#000000">
  <meta name="description" content="Smart Forex and Binary Trading Signal Assistant">

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    header {
      text-align: center;
      padding: 18px 5px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      color: #aaa;
      margin: 8px 0 0;
    }

    .status {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 11px;
      text-align: center;
      margin-bottom: 12px;
      font-size: 14px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      background: #fff;
      color: #000;
      margin-bottom: 15px;
    }

    button:active {
      transform: scale(.98);
    }

    .card {
      background: #111;
      border: 1px solid #252525;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .title-row h2 {
      margin: 0;
      font-size: 22px;
    }

    .price {
      color: #bbb;
      font-size: 14px;
    }

    .signal {
      text-align: center;
      padding: 18px 5px;
      margin: 14px 0;
      background: #181818;
      border-radius: 14px;
      font-size: 32px;
      font-weight: bold;
    }

    .BUY {
      color: #00ff88;
    }

    .SELL {
      color: #ff4d6d;
    }

    .WAIT {
      color: #ffd166;
    }

    .strength {
      text-align: center;
      font-size: 18px;
      margin-bottom: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .box {
      background: #181818;
      border-radius: 11px;
      padding: 12px;
    }

    .box small {
      display: block;
      color: #888;
      margin-bottom: 5px;
      font-size: 11px;
    }

    .box strong {
      font-size: 15px;
    }

    .section {
      font-size: 20px;
      margin: 20px 0 12px;
    }

    .reason {
      background: #181818;
      border-radius: 12px;
      padding: 12px;
      margin-top: 13px;
      color: #ccc;
      font-size: 13px;
      line-height: 1.7;
    }

    .time {
      color: #999;
      font-size: 13px;
      margin-top: 12px;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .result-box {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 13px 5px;
      text-align: center;
    }

    .result-box small {
      display: block;
      color: #888;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .result-box strong {
      font-size: 18px;
    }

    .mode {
      text-align: center;
      background: #181818;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
      color: #ddd;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      color: #999;
      padding: 20px;
    }

    .error {
      color: #ff4d6d;
      text-align: center;
      padding: 15px;
    }

    footer {
      text-align: center;
      color: #666;
      font-size: 11px;
      line-height: 1.6;
      padding: 20px 5px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>Trader Pink AI 📈</h1>
    <p>Smart Forex and Binary Trading Signal Assistant</p>
  </header>

  <div class="status" id="status">
    ● Ready
  </div>

  <div class="mode">
    📈 Forex + 🟢 Binary Mode
  </div>

  <button onclick="analyzeMarket()">
    🔍 Analyze Market
  </button>

  <div id="bestSignal"></div>

  <h2 class="section">📊 Market Analysis</h2>

  <div id="markets">
    <div class="loading">
      Analyze Market চাপুন
    </div>
  </div>

  <h2 class="section">🎯 Signal Results</h2>

  <div class="results">

    <div class="result-box">
      <small>Total Signals</small>
      <strong id="total">0</strong>
    </div>

    <div class="result-box">
      <small>Correct</small>
      <strong id="correct">0</strong>
    </div>

    <div class="result-box">
      <small>Accuracy</small>
      <strong id="accuracy">0%</strong>
    </div>

  </div>

  <footer>
    Bangladesh Time (UTC+6)<br>
    ⚠️ AI analysis only. No guaranteed profit.
  </footer>

</div>

<script>

const WORKER_URL =
  "https://crimson-grass-f881.bijondebnath51.workers.dev";


// ======================================
// SERVICE WORKER
// ======================================

if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker.register("./sw.js")
      .then(() => {
        console.log("Trader Pink AI App Ready");
      })
      .catch(error => {
        console.error(
          "Service Worker Error:",
          error
        );
      });

  });

}


// ======================================
// ANALYZE
// ======================================

async function analyzeMarket() {

  const status =
    document.getElementById("status");

  const markets =
    document.getElementById("markets");

  const best =
    document.getElementById("bestSignal");

  status.innerText =
    "● Connecting to Trading AI...";

  markets.innerHTML =
    '<div class="loading">⏳ Live market data আসছে...</div>';

  best.innerHTML = "";

  try {

    const response =
      await fetch(
        WORKER_URL + "/analyze",
        {
          method: "GET",
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "Worker HTTP " +
        response.status
      );

    }

    const data =
      await response.json();

    console.log(
      "Worker Response:",
      data
    );

    if (
      data.status !== "ok" &&
      data.status !== "success"
    ) {

      throw new Error(
        data.message ||
        "Analysis failed"
      );

    }

    status.innerText =
      "● AI Online • Live Data";

    showBestSignal(data);

    showMarkets(data);

    loadResults();

  } catch (error) {

    console.error(error);

    status.innerText =
      "● Connection Error";

    markets.innerHTML =
      '<div class="error">❌ ' +
      safe(error.message) +
      '</div>';

  }

}


// ======================================
// BEST SIGNAL
// ======================================

function showBestSignal(data) {

  const container =
    document.getElementById(
      "bestSignal"
    );

  let signal =
    data.best_signal || data.signal || {};

  const direction =
    signal.direction ||
    signal.signal ||
    "WAIT";

  const cls =
    direction === "BUY"
      ? "BUY"
      : direction === "SELL"
        ? "SELL"
        : "WAIT";

  const confidence =
    signal.confidence ||
    signal.strength ||
    data.score?.buy ||
    "0%";

  const market =
    signal.market ||
    data.symbol ||
    "EURUSD";

  const candleTime =
    signal.candle_time ||
    data.candle_time ||
    "--";

  const forex =
    data.forex || {};

  const binary =
    data.binary || {};

  const next =
    Array.isArray(data.next_candles)
      ? data.next_candles
      : [];

  container.innerHTML = `

    <div class="card">

      <div class="title-row">

        <h2>🎯 Best Signal</h2>

        <div class="price">
          ${safe(market)}
        </div>

      </div>

      <div class="signal ${cls}">
        ${safe(direction)}
      </div>

      <div class="strength">
        Confidence:
        <strong>
          ${safe(confidence)}
        </strong>
      </div>

      <div class="grid">

        <div class="box">
          <small>Forex Signal</small>
          <strong>
            ${safe(
              forex.signal ||
              direction
            )}
          </strong>
        </div>

        <div class="box">
          <small>Binary Signal</small>
          <strong>
            ${safe(
              binary.instruction ||
              binary.signal ||
              direction
            )}
          </strong>
        </div>

        <div class="box">
          <small>Binary Expiry</small>
          <strong>
            ${safe(
              binary.expiry_minutes ||
              5
            )} মিনিট
          </strong>
        </div>

        <div class="box">
          <small>Candle Time</small>
          <strong>
            ${safe(candleTime)}
          </strong>
        </div>

      </div>

      <div class="reason">

        <strong>⏱️ Signal Time</strong><br>

        Candle:
        ${safe(candleTime)}

        <br><br>

        <strong>🔮 Next Candles</strong><br>

        ${
          next.length
            ? next.map(item =>
                "Candle " +
                safe(item.candle) +
                " • " +
                safe(item.timeframe) +
                " • " +
                safe(
                  item.signal ||
                  item.expected_direction ||
                  "WAIT"
                )
              ).join("<br>")
            : "Next candle data পাওয়া যায়নি"
        }

      </div>

      <div class="time">
        🕐 Analysis Time:
        ${safe(
          data.timestamp ||
          "--"
        )}
      </div>

    </div>

  `;

}


// ======================================
// MARKETS
// ======================================

function showMarkets(data) {

  const container =
    document.getElementById(
      "markets"
    );

  let list =
    data.market_analysis;

  if (!Array.isArray(list)) {

    list = [{
      market: data.symbol || "EURUSD",
      price: data.price,
      signal:
        data.signal?.direction ||
        data.signal?.signal ||
        "WAIT",
      strength:
        data.signal?.confidence ||
        "0%",
      candle_time:
        data.candle_time,
      direction: {
        "1m": "-",
        "5m":
          data.signal?.direction ||
          "WAIT",
        "15m": "-"
      },
      trend: {
        "1m": "-",
        "5m":
          data.market?.trend ||
          "-",
        "15m": "-"
      },
      reason: []
    }];

  }

  if (
    list.length === 0
  ) {

    container.innerHTML =
      '<div class="loading">Market data পাওয়া যায়নি</div>';

    return;

  }

  container.innerHTML =
    list.map(market => {

      const direction =
        market.direction || {};

      const trend =
        market.trend || {};

      const signal =
        market.signal || "WAIT";

      const cls =
        signal === "BUY"
          ? "BUY"
          : signal === "SELL"
            ? "SELL"
            : "WAIT";

      const reasons =
        Array.isArray(market.reason)
          ? market.reason
          : [];

      return `

        <div class="card">

          <div class="title-row">

            <h2>
              ${safe(
                market.market ||
                market.symbol ||
                "Market"
              )}
            </h2>

            <div class="price">
              Price:
              ${showValue(market.price)}
            </div>

          </div>

          <div class="signal ${cls}">
            ${safe(signal)}
          </div>

          <div class="strength">
            Strength:
            <strong>
              ${safe(
                market.strength ||
                market.confidence ||
                "0%"
              )}
            </strong>
          </div>

          <div class="grid">

            <div class="box">
              <small>1 Minute</small>
              <strong>
                ${safe(
                  direction["1m"] || "-"
                )}
              </strong>
            </div>

            <div class="box">
              <small>5 Minutes</small>
              <strong>
                ${safe(
                  direction["5m"] || "-"
                )}
              </strong>
            </div>

            <div class="box">
              <small>15 Minutes</small>
              <strong>
                ${safe(
                  direction["15m"] || "-"
                )}
              </strong>
            </div>

            <div class="box">
              <small>1m Trend</small>
              <strong>
                ${safe(
                  trend["1m"] || "-"
                )}
              </strong>
            </div>

            <div class="box">
              <small>5m Trend</small>
              <strong>
                ${safe(
                  trend["5m"] || "-"
                )}
              </strong>
            </div>

            <div class="box">
              <small>15m Trend</small>
              <strong>
                ${safe(
                  trend["15m"] || "-"
                )}
              </strong>
            </div>

          </div>

          <div class="reason">

            <strong>🧠 AI Analysis</strong><br>

            ${
              reasons.length
                ? reasons
                    .map(
                      x =>
                        "• " +
                        safe(x)
                    )
                    .join("<br>")
                : "Market trend এবং candle analysis অনুযায়ী signal তৈরি হয়েছে।"
            }

          </div>

          <div class="time">

            🕐 Candle Time:
            ${safe(
              market.candle_time ||
              dataCandleTime(market) ||
              "--"
            )}

          </div>

        </div>

      `;

    }).join("");

}


// ======================================
// RESULTS
// ======================================

async function loadResults() {

  try {

    const response =
      await fetch(
        WORKER_URL + "/results",
        {
          method: "GET",
          cache: "no-store"
        }
      );

    if (!response.ok) {
      return;
    }

    const data =
      await response.json();

    if (
      data.status !== "success" &&
      data.status !== "ok"
    ) {
      return;
    }

    document.getElementById(
      "total"
    ).innerText =
      data.total_signals ?? 0;

    document.getElementById(
      "correct"
    ).innerText =
      data.correct ?? 0;

    document.getElementById(
      "accuracy"
    ).innerText =
      data.accuracy || "0%";

  } catch (error) {

    console.log(
      "Results error:",
      error
    );

  }

}


// ======================================
// HELPERS
// ======================================

function dataCandleTime(market) {

  return market.candleTime ||
         market.time ||
         "--";

}


function showValue(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "--";

  }

  return safe(value);

}


function safe(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// ======================================
// START
// ======================================

window.addEventListener(
  "load",
  function() {

    loadResults();

  }
);

</script>

</body>
</html>
