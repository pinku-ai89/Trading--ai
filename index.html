<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px 15px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: #1e293b;
      border: 1px solid #334155;
      white-space: pre-wrap;
      line-height: 1.7;
      min-height: 80px;
    }

    .warning {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #172033;
      color: #fbbf24;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🤖 Trading AI</h1>

    <div class="subtitle">
      Smart Trading Analysis Assistant
    </div>

    <textarea
      id="question"
      placeholder="যেমন: XAUUSD 5 মিনিট চার্টে এখন Buy নাকি Sell?">
    </textarea>

    <button id="analyzeBtn" onclick="analyzeMarket()">
      🔍 AI Analysis
    </button>

    <div id="result" class="result">
      আপনার মার্কেট প্রশ্ন লিখে AI Analysis চাপুন।
    </div>

    <div class="warning">
      ⚠️ Trading AI-এর বিশ্লেষণ শুধুমাত্র তথ্য ও শিক্ষার জন্য।
      মার্কেটে লাভ নিশ্চিত নয়। নিজের ঝুঁকি বিবেচনা করে সিদ্ধান্ত নিন।
    </div>

  </div>

  <script>

    const WORKER_URL =
      "https://crimson-grass-f881.bijondebnath51.workers.dev";

    async function analyzeMarket() {

      const question =
        document.getElementById("question").value.trim();

      const result =
        document.getElementById("result");

      const button =
        document.getElementById("analyzeBtn");

      if (!question) {
        result.innerText =
          "আগে আপনার মার্কেট প্রশ্ন লিখুন।";
        return;
      }

      button.disabled = true;
      button.innerText = "⏳ AI বিশ্লেষণ করছে...";

      result.innerText =
        "মার্কেট বিশ্লেষণ করা হচ্ছে...";

      try {

        const response = await fetch(WORKER_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: question
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "সার্ভার থেকে উত্তর পাওয়া যায়নি।"
          );
        }

        result.innerText =
          data.answer || "AI কোনো উত্তর দেয়নি।";

      } catch (error) {

        result.innerText =
          "❌ সমস্যা হয়েছে:\n\n" +
          error.message;

      } finally {

        button.disabled = false;
        button.innerText = "🔍 AI Analysis";

      }
    }

  </script>

</body>
</html>
