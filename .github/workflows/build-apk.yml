name: Build Trader Pink AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Create Android Project
      run: |
        mkdir -p app/src/main/java/com/traderpink/ai
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/mipmap-hdpi

        cat > settings.gradle <<'EOF'
        pluginManagement {
          repositories {
            google()
            mavenCentral()
            gradlePluginPortal()
          }
        }
        dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
            google()
            mavenCentral()
          }
        }
        rootProject.name="TraderPinkAI"
        include ":app"
        EOF

        cat > build.gradle <<'EOF'
        plugins {
          id 'com.android.application' version '8.6.1' apply false
        }
        EOF

        cat > app/build.gradle <<'EOF'
        plugins {
          id 'com.android.application'
        }

        android {
          namespace 'com.traderpink.ai'
          compileSdk 35

          defaultConfig {
            applicationId 'com.traderpink.ai'
            minSdk 23
            targetSdk 35
            versionCode 15
            versionName '1.0.15'
          }
        }
        EOF

        cat > app/src/main/AndroidManifest.xml <<'EOF'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>

          <application
            android:theme="@style/AppTheme"
            android:label="Trader Pink AI">

            <activity
              android:name=".MainActivity"
              android:exported="true">
              <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
              </intent-filter>
            </activity>

            <service
              android:name=".FloatingService"
              android:exported="false"
              android:foregroundServiceType="specialUse">
              <property
                android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                android:value="EURUSD live signal overlay"/>
            </service>

          </application>
        </manifest>
        EOF

        mkdir -p app/src/main/res/values

        cat > app/src/main/res/values/styles.xml <<'EOF'
        <resources>
          <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
            <item name="android:fontFamily">sans</item>
            <item name="android:colorAccent">#00e676</item>
            <item name="android:navigationBarColor">#080d18</item>
            <item name="android:statusBarColor">#080d18</item>
          </style>
        </resources>
        EOF

    - name: MainActivity
      run: |
        cat > app/src/main/java/com/traderpink/ai/MainActivity.java <<'EOF'
        package com.traderpink.ai;

        import android.app.*;
        import android.os.*;
        import android.content.*;
        import android.graphics.Color;
        import android.net.Uri;
        import android.provider.Settings;
        import android.view.*;
        import android.widget.*;
        import org.json.JSONObject;
        import java.net.*;
        import java.io.*;

        public class MainActivity extends Activity {

          static final String API =
            "https://crimson-grass-f881.bijondebnath51.workers.dev/";

          TextView signal,conf,time,trend;
          Handler h=new Handler();

          public void onCreate(Bundle b){
            super.onCreate(b);

            LinearLayout box=new LinearLayout(this);
            box.setOrientation(LinearLayout.VERTICAL);
            box.setPadding(30,30,30,30);
            box.setBackgroundColor(Color.rgb(8,13,24));

            TextView title=t("🤖 Trader Pink AI 📈",26);
            box.addView(title);

            TextView sub=t("EURUSD • 1 MIN",18);
            box.addView(sub);

            signal=t("WAIT",42);
            signal.setGravity(17);
            box.addView(signal);

            conf=t("--%",25);
            conf.setGravity(17);
            box.addView(conf);

            trend=t("WAIT",18);
            trend.setGravity(17);
            box.addView(trend);

            time=t("Candle: --",16);
            time.setGravity(17);
            box.addView(time);

            Button next=new Button(this);
            next.setText("◯  NEXT SIGNAL");
            next.setOnClickListener(v->load());
            box.addView(next);

            Button floatBtn=new Button(this);
            floatBtn.setText("🤖 START FLOATING BOT");
            floatBtn.setOnClickListener(v->startFloat());
            box.addView(floatBtn);

            Button download=new Button(this);
            download.setText("📱 DOWNLOAD APP");
            download.setOnClickListener(v->
              Toast.makeText(this,
                "আপনি ইতিমধ্যে Android App ব্যবহার করছেন",
                Toast.LENGTH_LONG).show());
            box.addView(download);

            setContentView(box);
            load();
            h.postDelayed(new Runnable(){
              public void run(){load();h.postDelayed(this,30000);}
            },30000);
          }

          TextView t(String s,int z){
            TextView v=new TextView(this);
            v.setText(s);
            v.setTextColor(Color.WHITE);
            v.setTextSize(z);
            v.setPadding(8,14,8,14);
            return v;
          }

          void load(){
            new Thread(()->{
              try{
                URL u=new URL(API+"?t="+System.currentTimeMillis());
                HttpURLConnection c=(HttpURLConnection)u.openConnection();
                c.setConnectTimeout(10000);
                c.setReadTimeout(10000);

                BufferedReader r=new BufferedReader(
                  new InputStreamReader(c.getInputStream()));

                StringBuilder s=new StringBuilder();
                String x;
                while((x=r.readLine())!=null)s.append(x);

                JSONObject j=new JSONObject(s.toString());

                runOnUiThread(()->{
                  try{
                    String sig=j.optString("signal","WAIT");
                    signal.setText(sig);
                    conf.setText(j.optInt("confidence",0)+"%");
                    trend.setText(
                      j.optJSONObject("candle")
                       .optString("direction","--"));
                    time.setText(
                      "Signal: "+
                      shortTime(j.optString("closed_candle_time","--"))+
                      "  → Next: "+
                      shortTime(j.optString("next_candle_time","--")));
                  }catch(Exception e){}
                });

              }catch(Exception e){
                runOnUiThread(()->signal.setText("WAIT"));
              }
            }).start();
          }

          String shortTime(String s){
            try{
              java.text.SimpleDateFormat a=
                new java.text.SimpleDateFormat(
                  "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'");
              a.setTimeZone(java.util.TimeZone.getTimeZone("UTC"));
              java.util.Date d=a.parse(s);

              java.text.SimpleDateFormat b=
                new java.text.SimpleDateFormat("HH:mm");
              b.setTimeZone(java.util.TimeZone.getTimeZone("Asia/Dhaka"));
              return b.format(d);
            }catch(Exception e){return "--";}
          }

          void startFloat(){
            if(!Settings.canDrawOverlays(this)){
              Intent i=new Intent(
                Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                Uri.parse("package:"+getPackageName()));
              startActivity(i);
              return;
            }
            startForegroundService(
              new Intent(this,FloatingService.class));
          }
        }
        EOF

    - name: FloatingService
      run: |
        cat > app/src/main/java/com/traderpink/ai/FloatingService.java <<'EOF'
        package com.traderpink.ai;

        import android.app.*;
        import android.content.*;
        import android.graphics.Color;
        import android.graphics.PixelFormat;
        import android.os.*;
        import android.view.*;
        import android.widget.*;
        import org.json.JSONObject;
        import java.net.*;
        import java.io.*;

        public class FloatingService extends Service {

          final String API=
            "https://crimson-grass-f881.bijondebnath51.workers.dev/";

          WindowManager wm;
          View v;
          TextView data;
          Handler h=new Handler();

          public void onCreate(){
            super.onCreate();

            String ch="channel";
            NotificationChannel nc=new NotificationChannel(
              ch,"Trader Pink AI",
              NotificationManager.IMPORTANCE_LOW);

            getSystemService(NotificationManager.class)
              .createNotificationChannel(nc);

            startForeground(15,new Notification.Builder(this,ch)
              .setContentTitle("Trader Pink AI")
              .setContentText("EURUSD 1M Floating Signal")
              .setSmallIcon(android.R.drawable.ic_dialog_info)
              .build());

            LinearLayout box=new LinearLayout(this);
            box.setOrientation(LinearLayout.VERTICAL);
            box.setPadding(18,12,18,12);
            box.setBackgroundColor(Color.rgb(17,26,43));

            TextView title=new TextView(this);
            title.setText("🤖 Trader Pink AI");
            title.setTextColor(Color.WHITE);
            title.setTextSize(17);
            box.addView(title);

            TextView market=new TextView(this);
            market.setText("EURUSD • 1M");
            market.setTextColor(Color.WHITE);
            market.setTextSize(14);
            box.addView(market);

            data=new TextView(this);
            data.setText("WAIT\n--%");
            data.setTextColor(Color.WHITE);
            data.setTextSize(22);
            data.setGravity(17);
            box.addView(data);

            TextView close=new TextView(this);
            close.setText("✕");
            close.setTextColor(Color.WHITE);
            close.setTextSize(22);
            close.setGravity(Gravity.RIGHT);
            close.setOnClickListener(x->stopSelf());
            box.addView(close);

            v=box;

            WindowManager.LayoutParams p=
              new WindowManager.LayoutParams(
                -2,-2,
                Build.VERSION.SDK_INT>=26?
                WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY:
                WindowManager.LayoutParams.TYPE_PHONE,
                WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                PixelFormat.TRANSLUCENT);

            p.gravity=Gravity.TOP|Gravity.RIGHT;
            p.x=15;p.y=150;

            wm=(WindowManager)getSystemService(WINDOW_SERVICE);
            wm.addView(v,p);

            load();

            h.postDelayed(new Runnable(){
              public void run(){
                load();
                h.postDelayed(this,30000);
              }
            },30000);
          }

          void load(){
            new Thread(()->{
              try{
                URL u=new URL(API+"?t="+System.currentTimeMillis());
                HttpURLConnection c=(HttpURLConnection)u.openConnection();
                c.setConnectTimeout(10000);
                c.setReadTimeout(10000);

                BufferedReader r=new BufferedReader(
                  new InputStreamReader(c.getInputStream()));

                StringBuilder s=new StringBuilder();
                String x;
                while((x=r.readLine())!=null)s.append(x);

                JSONObject j=new JSONObject(s.toString());

                String sig=j.optString("signal","WAIT");
                int cf=j.optInt("confidence",0);

                runOnUiThread(()->data.setText(
                  sig+" "+cf+"%\n"+
                  "Signal: "+
                  shortTime(j.optString("closed_candle_time","--"))+
                  "\nNext: "+
                  shortTime(j.optString("next_candle_time","--"))+
                  "\n"+
                  j.optJSONObject("candle")
                   .optString("direction","--")
                ));

              }catch(Exception e){}
            }).start();
          }

          String shortTime(String s){
            try{
              java.text.SimpleDateFormat a=
                new java.text.SimpleDateFormat(
                  "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'");
              a.setTimeZone(java.util.TimeZone.getTimeZone("UTC"));
              java.util.Date d=a.parse(s);

              java.text.SimpleDateFormat b=
                new java.text.SimpleDateFormat("HH:mm");
              b.setTimeZone(java.util.TimeZone.getTimeZone("Asia/Dhaka"));
              return b.format(d);
            }catch(Exception e){return "--";}
          }

          public void onDestroy(){
            h.removeCallbacksAndMessages(null);
            if(wm!=null&&v!=null)wm.removeView(v);
            super.onDestroy();
          }

          public IBinder onBind(Intent i){return null;}
        }
        EOF

    - name: Build APK
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
        unzip -q gradle-8.7-bin.zip
        ./gradle-8.7/bin/gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Trader-Pink-AI-Floating-v15
        path: app/build/outputs/apk/debug/app-debug.apk
