name: Build Trader Pink AI Floating APK v13

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/traderpink/ai
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "TraderPinkAI"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.traderpink.ai'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.traderpink.ai'
                  minSdk 23
                  targetSdk 35
                  versionCode 13
                  versionName '1.3'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Trader Pink AI</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>

              <application
                  android:allowBackup="true"
                  android:label="Trader Pink AI"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".FloatingService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse"/>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#ff4fa3</item>
                  <item name="android:navigationBarColor">#0b1020</item>
                  <item name="android:statusBarColor">#0b1020</item>
              </style>
          </resources>
          EOF

      - name: Create MainActivity
        shell: bash
        run: |
          cat > app/src/main/java/com/traderpink/ai/MainActivity.java <<'EOF'
          package com.traderpink.ai;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(35, 60, 35, 35);

                  TextView title = new TextView(this);
                  title.setText("🤖 Trader Pink AI");
                  title.setTextSize(26);
                  title.setPadding(0, 0, 0, 30);

                  TextView info = new TextView(this);
                  info.setText(
                      "EURUSD 1M\\n\\n" +
                      "Floating Bot চালু করতে নিচের বোতাম চাপুন।"
                  );
                  info.setTextSize(18);

                  Button button = new Button(this);
                  button.setText("START FLOATING BOT");

                  button.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) {
                          Intent intent = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );
                          startActivity(intent);
                      } else {
                          startService(new Intent(this, FloatingService.class));
                      }
                  });

                  layout.addView(title);
                  layout.addView(info);
                  layout.addView(button);

                  setContentView(layout);
              }
          }
          EOF

      - name: Create FloatingService
        shell: bash
        run: |
          cat > app/src/main/java/com/traderpink/ai/FloatingService.java <<'EOF'
          package com.traderpink.ai;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class FloatingService extends Service {

              private WindowManager windowManager;
              private LinearLayout box;

              private TextView title;
              private TextView market;
              private TextView signal;
              private TextView confidence;
              private TextView trend;
              private TextView candle;

              private final Handler handler = new Handler();

              private final String API_URL =
                  "https://crimson-grass-f881.bijondebnath51.workers.dev/";

              private final Runnable updater = new Runnable() {
                  @Override
                  public void run() {
                      updateSignal();
                      handler.postDelayed(this, 30000);
                  }
              };

              @Override
              public void onCreate() {
                  super.onCreate();

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  createNotification();

                  windowManager =
                      (WindowManager) getSystemService(WINDOW_SERVICE);

                  box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(24, 18, 24, 18);
                  box.setBackgroundColor(Color.rgb(15, 20, 35));

                  title = makeText("🤖 Trader Pink AI", 19);
                  market = makeText("EURUSD • 1M", 15);
                  signal = makeText("WAIT", 24);
                  confidence = makeText("Confidence: --%", 16);
                  trend = makeText("Trend: --", 15);
                  candle = makeText("Candle: --", 13);

                  box.addView(title);
                  box.addView(market);
                  box.addView(signal);
                  box.addView(confidence);
                  box.addView(trend);
                  box.addView(candle);

                  WindowManager.LayoutParams params =
                      new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                              ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                              : WindowManager.LayoutParams.TYPE_PHONE,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      );

                  params.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  params.y = 80;

                  windowManager.addView(box, params);

                  handler.post(updater);
              }

              private TextView makeText(String text, float size) {
                  TextView v = new TextView(this);
                  v.setText(text);
                  v.setTextColor(Color.WHITE);
                  v.setTextSize(size);
                  v.setPadding(0, 4, 0, 4);
                  return v;
              }

              private void updateSignal() {

                  new Thread(() -> {

                      HttpURLConnection connection = null;

                      try {
                          URL url = new URL(API_URL);
                          connection =
                              (HttpURLConnection) url.openConnection();

                          connection.setRequestMethod("GET");
                          connection.setConnectTimeout(10000);
                          connection.setReadTimeout(10000);
                          connection.setUseCaches(false);

                          InputStream input =
                              connection.getInputStream();

                          BufferedReader reader =
                              new BufferedReader(
                                  new InputStreamReader(input)
                              );

                          StringBuilder response = new StringBuilder();
                          String line;

                          while ((line = reader.readLine()) != null) {
                              response.append(line);
                          }

                          reader.close();

                          JSONObject data =
                              new JSONObject(response.toString());

                          String finalSignal =
                              data.optString("signal", "WAIT");

                          int conf =
                              data.optInt("confidence", 0);

                          String finalTrend =
                              data.optString("trend", "SIDEWAYS");

                          String candleTime =
                              data.optString(
                                  "closed_candle_time",
                                  "--"
                              );

                          handler.post(() -> {

                              signal.setText(finalSignal);
                              confidence.setText(
                                  "Confidence: " + conf + "%"
                              );
                              trend.setText(
                                  "Trend: " + finalTrend
                              );
                              candle.setText(
                                  "Closed Candle: " + candleTime
                              );

                              market.setText(
                                  data.optString(
                                      "symbol",
                                      "EUR/USD"
                                  ) + " • " +
                                  data.optString(
                                      "timeframe",
                                      "1M"
                                  )
                              );
                          });

                      } catch (Exception e) {

                          handler.post(() -> {
                              signal.setText("WAIT");
                              confidence.setText(
                                  "Confidence: --%"
                              );
                              trend.setText(
                                  "Connection retry..."
                              );
                          });

                      } finally {
                          if (connection != null) {
                              connection.disconnect();
                          }
                      }

                  }).start();
              }

              private void createNotification() {

                  String channelId = "trader_pink_ai";

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

                      NotificationChannel channel =
                          new NotificationChannel(
                              channelId,
                              "Trader Pink AI",
                              NotificationManager.IMPORTANCE_LOW
                          );

                      NotificationManager manager =
                          getSystemService(
                              NotificationManager.class
                          );

                      manager.createNotificationChannel(channel);
                  }

                  Notification notification;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      notification =
                          new Notification.Builder(
                              this,
                              channelId
                          )
                          .setContentTitle("Trader Pink AI")
                          .setContentText(
                              "Floating signal engine running"
                          )
                          .setSmallIcon(
                              android.R.drawable.ic_dialog_info
                          )
                          .build();
                  } else {
                      notification =
                          new Notification.Builder(this)
                          .setContentTitle("Trader Pink AI")
                          .setContentText(
                              "Floating signal engine running"
                          )
                          .setSmallIcon(
                              android.R.drawable.ic_dialog_info
                          )
                          .build();
                  }

                  startForeground(1001, notification);
              }

              @Override
              public int onStartCommand(
                  Intent intent,
                  int flags,
                  int startId
              ) {
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  handler.removeCallbacks(updater);

                  if (windowManager != null && box != null) {
                      try {
                          windowManager.removeView(box);
                      } catch (Exception ignored) {
                      }
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trader-Pink-AI-Floating-v13
          path: app/build/outputs/apk/debug/app-debug.apk
