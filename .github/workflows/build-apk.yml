name: Build Trader Pink AI Floating APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/traderpinkai/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "TraderPinkAI"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.traderpinkai.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.traderpinkai.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 7
                  versionName '7.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#ff4f9a</item>
                  <item name="android:statusBarColor">#ff4f9a</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Trader Pink AI"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".FloatingService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">

                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Trader Pink AI floating trading assistant"/>

                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/traderpinkai/app/MainActivity.java <<'EOF'
          package com.traderpinkai.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private WebView webView;
              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.WHITE);

                  TextView title = new TextView(this);
                  title.setText("🤖 Trader Pink AI v7.0");
                  title.setTextSize(22);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(10, 18, 10, 10);

                  root.addView(
                      title,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  );

                  Button floatingButton = new Button(this);
                  floatingButton.setText("🟣 FLOATING BOT চালু করুন");
                  floatingButton.setTextSize(17);

                  root.addView(
                      floatingButton,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  );

                  status = new TextView(this);
                  status.setText(
                      "প্রথমে বাটনে চাপুন। তারপর Overlay permission Allow করুন।"
                  );
                  status.setTextSize(14);
                  status.setTextColor(Color.DKGRAY);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(10, 4, 10, 10);

                  root.addView(
                      status,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  );

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                      "https://pinku-ai89.github.io/Trading--ai/"
                  );

                  root.addView(
                      webView,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1
                      )
                  );

                  setContentView(root);

                  floatingButton.setOnClickListener(v -> {

                      if (!Settings.canDrawOverlays(this)) {

                          status.setText(
                              "⚠️ এখন Overlay permission Allow করুন।"
                          );

                          try {
                              Intent intent = new Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse(
                                      "package:" + getPackageName()
                                  )
                              );

                              startActivity(intent);

                          } catch (Exception e) {

                              startActivity(
                                  new Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION
                                  )
                              );
                          }

                      } else {

                          startFloatingService();

                          status.setText(
                              "✅ Floating Bot চালু আছে"
                          );
                      }
                  });
              }

              private void startFloatingService() {

                  Intent service = new Intent(
                      this,
                      FloatingService.class
                  );

                  if (Build.VERSION.SDK_INT >= 26) {
                      startForegroundService(service);
                  } else {
                      startService(service);
                  }

                  Toast.makeText(
                      this,
                      "Floating Bot চালু হয়েছে",
                      Toast.LENGTH_SHORT
                  ).show();
              }

              @Override
              protected void onResume() {
                  super.onResume();

                  if (webView != null) {
                      webView.onResume();
                  }

                  if (Settings.canDrawOverlays(this)) {
                      if (status != null) {
                          status.setText(
                              "✅ Overlay permission চালু আছে। Floating Bot চালু করুন।"
                          );
                      }
                  }
              }

              @Override
              protected void onPause() {

                  if (webView != null) {
                      webView.onPause();
                  }

                  super.onPause();
              }

              @Override
              public void onBackPressed() {

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/traderpinkai/app/FloatingService.java <<'EOF'
          package com.traderpinkai.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class FloatingService extends Service {

              private WindowManager windowManager;
              private View floatingView;
              private WindowManager.LayoutParams params;

              @Override
              public void onCreate() {
                  super.onCreate();

                  createNotificationChannel();

                  Notification notification =
                      new Notification.Builder(
                          this,
                          "trader_pink_ai"
                      )
                      .setContentTitle("Trader Pink AI")
                      .setContentText("Floating Bot চালু আছে")
                      .setSmallIcon(
                          android.R.drawable.ic_dialog_info
                      )
                      .setOngoing(true)
                      .build();

                  startForeground(1001, notification);

                  showFloatingWindow();
              }

              private void showFloatingWindow() {

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  windowManager =
                      (WindowManager)
                          getSystemService(WINDOW_SERVICE);

                  LinearLayout box =
                      new LinearLayout(this);

                  box.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  box.setPadding(
                      20, 12, 20, 12
                  );

                  box.setBackgroundColor(
                      Color.WHITE
                  );

                  TextView title =
                      new TextView(this);

                  title.setText(
                      "🤖 Trader Pink AI"
                  );

                  title.setTextSize(17);
                  title.setTextColor(Color.BLACK);

                  TextView market =
                      new TextView(this);

                  market.setText(
                      "EURUSD • 1M / 5M / 15M"
                  );

                  market.setTextSize(14);
                  market.setTextColor(Color.DKGRAY);

                  TextView signal =
                      new TextView(this);

                  signal.setText(
                      "⏳ WAIT • 50%"
                  );

                  signal.setTextSize(20);
                  signal.setTextColor(
                      Color.rgb(220, 140, 20)
                  );

                  TextView trend =
                      new TextView(this);

                  trend.setText(
                      "📉 DOWNTREND"
                  );

                  trend.setTextSize(14);
                  trend.setTextColor(Color.DKGRAY);

                  TextView open =
                      new TextView(this);

                  open.setText(
                      "📈 অ্যাপ খুলুন"
                  );

                  open.setTextSize(15);
                  open.setTextColor(
                      Color.rgb(30, 100, 200)
                  );

                  TextView close =
                      new TextView(this);

                  close.setText(
                      "✕ বন্ধ"
                  );

                  close.setTextSize(14);
                  close.setTextColor(Color.RED);

                  box.addView(title);
                  box.addView(market);
                  box.addView(signal);
                  box.addView(trend);
                  box.addView(open);
                  box.addView(close);

                  int type =
                      Build.VERSION.SDK_INT >= 26
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;

                  params =
                      new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          type,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      );

                  params.gravity =
                      Gravity.TOP | Gravity.LEFT;

                  params.x = 20;
                  params.y = 180;

                  floatingView = box;

                  windowManager.addView(
                      floatingView,
                      params
                  );

                  box.setOnTouchListener(
                      new View.OnTouchListener() {

                          private int initialX;
                          private int initialY;
                          private float initialTouchX;
                          private float initialTouchY;

                          @Override
                          public boolean onTouch(
                              View v,
                              MotionEvent event
                          ) {

                              switch (
                                  event.getAction()
                              ) {

                                  case MotionEvent.ACTION_DOWN:

                                      initialX = params.x;
                                      initialY = params.y;

                                      initialTouchX =
                                          event.getRawX();

                                      initialTouchY =
                                          event.getRawY();

                                      return true;

                                  case MotionEvent.ACTION_MOVE:

                                      params.x =
                                          initialX +
                                          (int)(
                                              event.getRawX()
                                              - initialTouchX
                                          );

                                      params.y =
                                          initialY +
                                          (int)(
                                              event.getRawY()
                                              - initialTouchY
                                          );

                                      windowManager.updateViewLayout(
                                          floatingView,
                                          params
                                      );

                                      return true;
                              }

                              return false;
                          }
                      }
                  );

                  open.setOnClickListener(v -> {

                      Intent intent =
                          new Intent(
                              this,
                              MainActivity.class
                          );

                      intent.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK
                      );

                      startActivity(intent);
                  });

                  close.setOnClickListener(
                      v -> stopSelf()
                  );
              }

              private void createNotificationChannel() {

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel channel =
                          new NotificationChannel(
                              "trader_pink_ai",
                              "Trader Pink AI",
                              NotificationManager.IMPORTANCE_LOW
                          );

                      NotificationManager manager =
                          getSystemService(
                              NotificationManager.class
                          );

                      if (manager != null) {
                          manager.createNotificationChannel(
                              channel
                          );
                      }
                  }
              }

              @Override
              public void onDestroy() {

                  if (
                      floatingView != null &&
                      windowManager != null
                  ) {

                      try {
                          windowManager.removeView(
                              floatingView
                          );
                      } catch (Exception ignored) {
                      }
                  }

                  floatingView = null;
                  windowManager = null;

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                  Intent intent
              ) {
                  return null;
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trader-Pink-AI-Floating-v7
          path: app/build/outputs/apk/debug/app-debug.apk
