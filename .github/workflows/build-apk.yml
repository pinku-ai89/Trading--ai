name: Build Trader Pink AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android Project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/traderpink/ai
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }

          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }

          rootProject.name = "TraderPinkAI"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.traderpink.ai'
            compileSdk 35

            defaultConfig {
              applicationId 'com.traderpink.ai'
              minSdk 23
              targetSdk 35
              versionCode 15
              versionName '1.0.15'
            }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme"
              parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowActionModeOverlay">true</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>

            <application
              android:theme="@style/AppTheme"
              android:label="Trader Pink AI"
              android:allowBackup="false"
              android:supportsRtl="true">

              <activity
                android:name=".MainActivity"
                android:exported="true">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>

              </activity>

              <service
                android:name=".FloatingService"
                android:exported="false"
                android:foregroundServiceType="specialUse">

                <property
                  android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                  android:value="market signal floating overlay"/>

              </service>

            </application>

          </manifest>
          EOF

      - name: Create MainActivity
        shell: bash
        run: |
          cat > app/src/main/java/com/traderpink/ai/MainActivity.java <<'EOF'
          package com.traderpink.ai;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.graphics.Color;
          import android.view.View;
          import android.widget.*;

          import org.json.JSONObject;

          public class MainActivity extends Activity {

            final String API =
              "https://crimson-grass-f881.bijondebnath51.workers.dev/";

            TextView signal;
            TextView info;

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);

              LinearLayout root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setPadding(25,30,25,25);

              TextView title = new TextView(this);
              title.setText("🤖 Trader Pink AI 📈");
              title.setTextSize(25);
              title.setTextColor(Color.BLACK);

              TextView market = new TextView(this);
              market.setText("EURUSD • 1 MIN");
              market.setTextSize(18);

              signal = new TextView(this);
              signal.setText("WAIT");
              signal.setTextSize(38);
              signal.setPadding(0,20,0,20);

              info = new TextView(this);
              info.setText("Loading...");
              info.setTextSize(16);

              Button next = new Button(this);
              next.setText("NEXT SIGNAL");

              Button floating = new Button(this);
              floating.setText("START FLOATING BOT");

              root.addView(title);
              root.addView(market);
              root.addView(signal);
              root.addView(info);
              root.addView(next);
              root.addView(floating);

              setContentView(root);

              next.setOnClickListener(v -> load());
              floating.setOnClickListener(v -> startFloating());

              load();
            }

            void load() {
              new Thread(() -> {
                try {
                  java.net.URL u = new java.net.URL(API);
                  java.net.HttpURLConnection c =
                    (java.net.HttpURLConnection) u.openConnection();

                  c.setConnectTimeout(10000);
                  c.setReadTimeout(10000);

                  java.io.BufferedReader r =
                    new java.io.BufferedReader(
                      new java.io.InputStreamReader(c.getInputStream()));

                  StringBuilder s = new StringBuilder();
                  String line;

                  while ((line = r.readLine()) != null)
                    s.append(line);

                  JSONObject j = new JSONObject(s.toString());

                  String sig = j.optString("signal","WAIT");
                  int conf = j.optInt("confidence",0);
                  String candle =
                    j.optString("closed_candle_time","");

                  runOnUiThread(() -> {
                    signal.setText(sig + "  " + conf + "%");
                    info.setText(
                      "Signal Candle: " + candle +
                      "\nNext Candle: 1 MIN"
                    );
                  });

                  c.disconnect();

                } catch (Exception e) {
                  runOnUiThread(() ->
                    info.setText("Connection error"));
                }
              }).start();
            }

            void startFloating() {
              if (!Settings.canDrawOverlays(this)) {
                Intent i = new Intent(
                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                  Uri.parse("package:" + getPackageName())
                );
                startActivity(i);
                return;
              }

              Intent i =
                new Intent(this, FloatingService.class);

              if (android.os.Build.VERSION.SDK_INT >= 26)
                startForegroundService(i);
              else
                startService(i);
            }
          }
          EOF

      - name: Create FloatingService
        shell: bash
        run: |
          cat > app/src/main/java/com/traderpink/ai/FloatingService.java <<'EOF'
          package com.traderpink.ai;

          import android.app.*;
          import android.content.*;
          import android.graphics.*;
          import android.os.*;
          import android.view.*;
          import android.widget.*;

          import org.json.JSONObject;

          public class FloatingService extends Service {

            final String API =
              "https://crimson-grass-f881.bijondebnath51.workers.dev/";

            WindowManager wm;
            WindowManager.LayoutParams params;
            LinearLayout box;
            TextView text;

            Handler handler =
              new Handler(Looper.getMainLooper());

            Runnable refresh = new Runnable() {
              @Override
              public void run() {
                load();
                handler.postDelayed(this,30000);
              }
            };

            @Override
            public void onCreate() {
              super.onCreate();

              createChannel();

              Notification n =
                new Notification.Builder(this,"pink")
                  .setContentTitle("Trader Pink AI")
                  .setContentText("EURUSD • 1M")
                  .setSmallIcon(android.R.drawable.ic_dialog_info)
                  .build();

              startForeground(10,n);

              showOverlay();
              handler.post(refresh);
            }

            void showOverlay() {
              wm = (WindowManager)
                getSystemService(WINDOW_SERVICE);

              box = new LinearLayout(this);
              box.setOrientation(LinearLayout.VERTICAL);
              box.setPadding(18,12,18,12);
              box.setBackgroundColor(Color.WHITE);

              text = new TextView(this);
              text.setText(
                "🤖 Trader Pink AI\n" +
                "EURUSD • 1M\nLoading..."
              );
              text.setTextSize(17);
              text.setTextColor(Color.BLACK);

              Button close = new Button(this);
              close.setText("X");
              close.setOnClickListener(v -> stopSelf());

              box.addView(text);
              box.addView(close);

              int type =
                Build.VERSION.SDK_INT >= 26
                ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                : WindowManager.LayoutParams.TYPE_PHONE;

              params = new WindowManager.LayoutParams(
                340,
                WindowManager.LayoutParams.WRAP_CONTENT,
                type,
                WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                PixelFormat.TRANSLUCENT
              );

              params.gravity =
                Gravity.TOP | Gravity.RIGHT;

              params.x = 15;
              params.y = 120;

              wm.addView(box,params);

              box.setOnTouchListener(
                new View.OnTouchListener() {

                  float downX,downY;
                  int startX,startY;

                  @Override
                  public boolean onTouch(
                    View v, MotionEvent e) {

                    if(e.getAction()==MotionEvent.ACTION_DOWN) {
                      downX=e.getRawX();
                      downY=e.getRawY();
                      startX=params.x;
                      startY=params.y;
                      return true;
                    }

                    if(e.getAction()==MotionEvent.ACTION_MOVE) {
                      params.x =
                        startX + (int)(downX-e.getRawX());
                      params.y =
                        startY + (int)(e.getRawY()-downY);

                      wm.updateViewLayout(box,params);
                      return true;
                    }

                    return true;
                  }
                }
              );
            }

            void load() {
              new Thread(() -> {
                try {
                  java.net.URL u =
                    new java.net.URL(API);

                  java.net.HttpURLConnection c =
                    (java.net.HttpURLConnection)
                    u.openConnection();

                  c.setConnectTimeout(10000);
                  c.setReadTimeout(10000);

                  java.io.BufferedReader r =
                    new java.io.BufferedReader(
                      new java.io.InputStreamReader(
                        c.getInputStream()));

                  StringBuilder s =
                    new StringBuilder();

                  String line;

                  while((line=r.readLine())!=null)
                    s.append(line);

                  JSONObject j =
                    new JSONObject(s.toString());

                  String sig =
                    j.optString("signal","WAIT");

                  int conf =
                    j.optInt("confidence",0);

                  String candle =
                    j.optString(
                      "closed_candle_time","");

                  JSONObject co =
                    j.optJSONObject("candle");

                  String dir =
                    co == null ? "" :
                    co.optString("direction","");

                  handler.post(() ->
                    text.setText(
                      "🤖 Trader Pink AI\n" +
                      "EURUSD • 1M\n\n" +
                      sig + "  " + conf + "%\n" +
                      "Candle: " + candle + "\n" +
                      "Direction: " + dir
                    )
                  );

                  c.disconnect();

                } catch(Exception e) {
                  handler.post(() ->
                    text.setText(
                      "🤖 Trader Pink AI\n" +
                      "Connection error"
                    )
                  );
                }
              }).start();
            }

            void createChannel() {
              if(Build.VERSION.SDK_INT >= 26) {
                NotificationChannel ch =
                  new NotificationChannel(
                    "pink",
                    "Trader Pink AI",
                    NotificationManager.IMPORTANCE_LOW
                  );

                getSystemService(
                  NotificationManager.class
                ).createNotificationChannel(ch);
              }
            }

            @Override
            public void onDestroy() {
              handler.removeCallbacks(refresh);

              if(wm != null && box != null) {
                try {
                  wm.removeView(box);
                } catch(Exception ignored) {}
              }

              super.onDestroy();
            }

            @Override
            public IBinder onBind(Intent intent) {
              return null;
            }
          }
          EOF

      - name: Install Gradle
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build APK
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trader-Pink-AI-Floating-v15
          path: app/build/outputs/apk/debug/app-debug.apk
