name: Build Trader Pink AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "app/src/main/java/**"
      - "AndroidManifest.xml"
      - "app/build.gradle"
      - "settings.gradle"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android Project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/traderpink/ai
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "TraderPinkAI"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.traderpink.ai'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.traderpink.ai'
                  minSdk 23
                  targetSdk 35
                  versionCode 17
                  versionName "1.0.17"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                     parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#ff4f9a</item>
                  <item name="android:navigationBarColor">#0b1020</item>
                  <item name="android:statusBarColor">#0b1020</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cp AndroidManifest.xml \
             app/src/main/AndroidManifest.xml

      - name: Verify Android Files
        run: |
          echo "Checking Android files..."

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/traderpink/ai/MainActivity.java
          test -f app/src/main/java/com/traderpink/ai/FloatingService.java

          echo "All Android files are ready."

      - name: Install Gradle
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trader-Pink-AI-Floating-v17
          path: app/build/outputs/apk/debug/app-debug.apk
