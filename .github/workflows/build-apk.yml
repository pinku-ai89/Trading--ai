          cat > app/src/main/java/com/traderpinkai/app/MainActivity.java <<'EOF'
package com.traderpinkai.app;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;

public class MainActivity extends Activity {

    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        webView = new WebView(this);

        WebSettings settings = webView.getSettings();
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setDatabaseEnabled(true);
        settings.setCacheMode(WebSettings.LOAD_NO_CACHE);

        webView.setWebViewClient(new WebViewClient());

        webView.loadUrl(
            "https://pinku-ai89.github.io/Trading--ai/"
        );

        setContentView(webView);
    }

    @Override
    public void onBackPressed() {
        if (webView.canGoBack()) {
            webView.goBack();
        } else {
            super.onBackPressed();
        }
    }
}
EOF

          cat > app/src/main/java/com/traderpinkai/app/FloatingService.java <<'EOF'
package com.traderpinkai.app;

import android.app.Notification;
import android.app.NotificationChannel;
import android.app.NotificationManager;
import android.app.Service;
import android.content.Intent;
import android.graphics.Color;
import android.graphics.PixelFormat;
import android.os.Build;
import android.os.Handler;
import android.os.IBinder;
import android.provider.Settings;
import android.view.Gravity;
import android.view.MotionEvent;
import android.view.View;
import android.view.WindowManager;
import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.TextView;

import org.json.JSONObject;

import java.io.BufferedReader;
import java.io.InputStream;
import java.io.InputStreamReader;
import java.net.HttpURLConnection;
import java.net.URL;
import java.text.SimpleDateFormat;
import java.util.Date;
import java.util.Locale;
import java.util.TimeZone;

public class FloatingService extends Service {

    private static final String API =
            "https://crimson-grass-f881.bijondebnath51.workers.dev/";

    private WindowManager windowManager;
    private LinearLayout box;

    private TextView signalText;
    private TextView confidenceText;
    private TextView trendText;
    private TextView candleText;
    private TextView nextCandleText;
    private TextView scoreText;
    private TextView statusText;

    private final Handler handler = new Handler();

    private final Runnable updater = new Runnable() {
        @Override
        public void run() {
            loadSignal();
            handler.postDelayed(this, 30000);
        }
    };

    @Override
    public void onCreate() {
        super.onCreate();

        createNotificationChannel();
        startForeground(1001, createNotification());

        createFloatingWindow();

        handler.post(updater);
    }

    private void createNotificationChannel() {

        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

            NotificationChannel channel =
                    new NotificationChannel(
                            "trader_pink_ai",
                            "Trader Pink AI",
                            NotificationManager.IMPORTANCE_LOW
                    );

            NotificationManager manager =
                    getSystemService(NotificationManager.class);

            if (manager != null) {
                manager.createNotificationChannel(channel);
            }
        }
    }

    private Notification createNotification() {

        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

            return new Notification.Builder(
                    this,
                    "trader_pink_ai"
            )
                    .setContentTitle("Trader Pink AI")
                    .setContentText("Floating signal is running")
                    .setSmallIcon(android.R.drawable.ic_dialog_info)
                    .build();

        } else {

            return new Notification.Builder(this)
                    .setContentTitle("Trader Pink AI")
                    .setContentText("Floating signal is running")
                    .setSmallIcon(android.R.drawable.ic_dialog_info)
                    .build();
        }
    }

    private void createFloatingWindow() {

        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {

            if (!Settings.canDrawOverlays(this)) {
                stopSelf();
                return;
            }
        }

        windowManager =
                (WindowManager) getSystemService(WINDOW_SERVICE);

        box = new LinearLayout(this);
        box.setOrientation(LinearLayout.VERTICAL);
        box.setPadding(18, 14, 18, 14);
        box.setBackgroundColor(Color.rgb(20, 20, 30));

        TextView titleText =
                makeText("🤖 Trader Pink AI", 18, true);

        TextView marketText =
                makeText("EURUSD • 1M", 15, true);

        signalText =
                makeText("WAIT", 26, true);

        confidenceText =
                makeText("Confidence: --%", 16, true);

        trendText =
                makeText("Trend: --", 14, false);

        candleText =
                makeText("Closed: --", 12, false);

        nextCandleText =
                makeText("Next: --", 12, false);

        scoreText =
                makeText("Score B:0 / S:0", 12, false);

        statusText =
                makeText("Updating...", 11, false);

        Button nextButton = new Button(this);
        nextButton.setText("NEXT SIGNAL");

        nextButton.setOnClickListener(
                new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        loadSignal();
                    }
                }
        );

        Button closeButton = new Button(this);
        closeButton.setText("✕ CLOSE");

        closeButton.setOnClickListener(
                new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        stopSelf();
                    }
                }
        );

        box.addView(titleText);
        box.addView(marketText);
        box.addView(signalText);
        box.addView(confidenceText);
        box.addView(trendText);
        box.addView(candleText);
        box.addView(nextCandleText);
        box.addView(scoreText);
        box.addView(statusText);
        box.addView(nextButton);
        box.addView(closeButton);

        int type;

        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            type =
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY;
        } else {
            type =
                    WindowManager.LayoutParams.TYPE_PHONE;
        }

        final WindowManager.LayoutParams params =
                new WindowManager.LayoutParams(
                        WindowManager.LayoutParams.WRAP_CONTENT,
                        WindowManager.LayoutParams.WRAP_CONTENT,
                        type,
                        WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                        PixelFormat.TRANSLUCENT
                );

        params.gravity =
                Gravity.TOP | Gravity.START;

        params.x = 20;
        params.y = 180;

        box.setOnTouchListener(
                new View.OnTouchListener() {

                    private int initialX;
                    private int initialY;

                    private float initialTouchX;
                    private float initialTouchY;

                    @Override
                    public boolean onTouch(
                            View v,
                            MotionEvent event
                    ) {

                        switch (event.getAction()) {

                            case MotionEvent.ACTION_DOWN:

                                initialX = params.x;
                                initialY = params.y;

                                initialTouchX =
                                        event.getRawX();

                                initialTouchY =
                                        event.getRawY();

                                return true;

                            case MotionEvent.ACTION_MOVE:

                                params.x =
                                        initialX +
                                        (int) (
                                                event.getRawX()
                                                        - initialTouchX
                                        );

                                params.y =
                                        initialY +
                                        (int) (
                                                event.getRawY()
                                                        - initialTouchY
                                        );

                                if (windowManager != null) {
                                    windowManager.updateViewLayout(
                                            box,
                                            params
                                    );
                                }

                                return true;
                        }

                        return false;
                    }
                }
        );

        windowManager.addView(box, params);
    }

    private TextView makeText(
            String text,
            int size,
            boolean bold
    ) {

        TextView t = new TextView(this);

        t.setText(text);
        t.setTextColor(Color.WHITE);
        t.setTextSize(size);

        if (bold) {
            t.setTypeface(
                    null,
                    android.graphics.Typeface.BOLD
            );
        }

        t.setPadding(4, 4, 4, 4);

        return t;
    }

    private void loadSignal() {

        if (statusText != null) {
            statusText.setText("Updating...");
        }

        new Thread(
                new Runnable() {

                    @Override
                    public void run() {

                        HttpURLConnection connection = null;

                        try {

                            String requestUrl =
                                    API
                                    + "?interval=1min"
                                    + "&symbol=EUR%2FUSD"
                                    + "&_="
                                    + System.currentTimeMillis();

                            URL url =
                                    new URL(requestUrl);

                            connection =
                                    (HttpURLConnection)
                                            url.openConnection();

                            connection.setRequestMethod("GET");
                            connection.setConnectTimeout(10000);
                            connection.setReadTimeout(10000);
                            connection.setUseCaches(false);

                            connection.setRequestProperty(
                                    "Cache-Control",
                                    "no-cache, no-store, max-age=0"
                            );

                            connection.setRequestProperty(
                                    "Pragma",
                                    "no-cache"
                            );

                            int responseCode =
                                    connection.getResponseCode();

                            InputStream stream;

                            if (responseCode >= 200
                                    && responseCode < 300) {

                                stream =
                                        connection.getInputStream();

                            } else {

                                stream =
                                        connection.getErrorStream();

                                if (stream == null) {
                                    throw new Exception(
                                            "HTTP "
                                                    + responseCode
                                    );
                                }
                            }

                            BufferedReader reader =
                                    new BufferedReader(
                                            new InputStreamReader(
                                                    stream
                                            )
                                    );

                            StringBuilder result =
                                    new StringBuilder();

                            String line;

                            while (
                                    (line = reader.readLine())
                                            != null
                            ) {

                                result.append(line);
                            }

                            reader.close();

                            JSONObject json =
                                    new JSONObject(
                                            result.toString()
                                    );

                            final String signal =
                                    json.optString(
                                            "signal",
                                            "WAIT"
                                    ).toUpperCase(
                                            Locale.US
                                    );

                            final int confidence =
                                    json.optInt(
                                            "confidence",
                                            0
                                    );

                            final String trend =
                                    json.optString(
                                            "trend",
                                            "SIDEWAYS"
                                    ).toUpperCase(
                                            Locale.US
                                    );

                            final String closed =
                                    json.optString(
                                            "closed_candle_time",
                                            "--"
                                    );

                            final String next =
                                    json.optString(
                                            "next_candle_time",
                                            "--"
                                    );

                            final int buyScore =
                                    json.optInt(
                                            "buy_score",
                                            0
                                    );

                            final int sellScore =
                                    json.optInt(
                                            "sell_score",
                                            0
                                    );

                            final String signalId =
                                    json.optString(
                                            "signal_id",
                                            "--"
                                    );

                            runOnUiThread(
                                    new Runnable() {

                                        @Override
                                        public void run() {

                                            signalText.setText(
                                                    signal
                                                            + "  "
                                                            + confidence
                                                            + "%"
                                            );

                                            confidenceText.setText(
                                                    "Confidence: "
                                                            + confidence
                                                            + "%"
                                            );

                                            trendText.setText(
                                                    "Trend: "
                                                            + trend
                                            );

                                            candleText.setText(
                                                    "Closed: "
                                                            + formatTime(
                                                                    closed
                                                            )
                                            );

                                            nextCandleText.setText(
                                                    "Next: "
                                                            + formatTime(
                                                                    next
                                                            )
                                            );

                                            scoreText.setText(
                                                    "Score B:"
                                                            + buyScore
                                                            + " / S:"
                                                            + sellScore
                                                            + "  ID:"
                                                            + signalId
                                            );

                                            String updateTime =
                                                    new SimpleDateFormat(
                                                            "HH:mm:ss",
                                                            Locale.US
                                                    ).format(
                                                            new Date()
                                                    );

                                            statusText.setText(
                                                    "Live • Updated "
                                                            + updateTime
                                            );
                                        }
                                    }
                            );

                        } catch (Exception e) {

                            final String error =
                                    e.getMessage() == null
                                            ? "Connection error"
                                            : e.getMessage();

                            runOnUiThread(
                                    new Runnable() {

                                        @Override
                                        public void run() {

                                            statusText.setText(
                                                    "Error: "
                                                            + error
                                            );
                                        }
                                    }
                            );

                        } finally {

                            if (connection != null) {
                                connection.disconnect();
                            }
                        }
                    }
                }
        ).start();
    }

    private String formatTime(String iso) {

        if (iso == null
                || iso.equals("--")
                || iso.length() < 10) {

            return iso;
        }

        try {

            SimpleDateFormat input =
                    new SimpleDateFormat(
                            "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'",
                            Locale.US
                    );

            input.setTimeZone(
                    TimeZone.getTimeZone("UTC")
            );

            Date date =
                    input.parse(iso);

            if (date == null) {
                return iso;
            }

            SimpleDateFormat output =
                    new SimpleDateFormat(
                            "dd/MM/yyyy HH:mm:ss",
                            Locale.US
                    );

            output.setTimeZone(
                    TimeZone.getTimeZone("Asia/Dhaka")
            );

            return output.format(date);

        } catch (Exception e) {

            return iso;
        }
    }

    @Override
    public void onDestroy() {

        handler.removeCallbacks(updater);

        if (windowManager != null
                && box != null) {

            try {
                windowManager.removeView(box);
            } catch (Exception ignored) {
            }
        }

        super.onDestroy();
    }

    @Override
    public IBinder onBind(Intent intent) {
        return null;
    }
}
EOF

      - name: Create Gradle Wrapper
        run: |
          curl -L \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o gradle.zip

          unzip -q gradle.zip

      - name: Build APK
        run: |
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trader-Pink-AI-Floating-v14
          path: app/build/outputs/apk/debug/app-debug.apk
