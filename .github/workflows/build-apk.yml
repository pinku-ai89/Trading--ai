name: Build Trader Pink AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/traderpinkai/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "TraderPinkAI"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.traderpinkai.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.traderpinkai.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 7
                  versionName '7.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#ff4f9a</item>
                  <item name="android:statusBarColor">#ff4f9a</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE"/>

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Trader Pink AI"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".FloatingService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">

                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Trader Pink AI floating trading assistant"/>

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/traderpinkai/app/MainActivity.java <<'EOF'
          package com.traderpinkai.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private WebView webView;
              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.WHITE);

                  TextView title = new TextView(this);
                  title.setText("🤖 Trader Pink AI");
                  title.setTextSize(22);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(10, 18, 10, 10);

                  root.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                  );

                  Button floatingButton = new Button(this);
                  floatingButton.setText("🤖 FLOATING AI চালু করুন");
                  floatingButton.setTextSize(17);

                  root.addView(
                          floatingButton,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                  );

                  status = new TextView(this);
                  status.setText(
                          "স্ক্রিনের উপর ভাসমান AI Button চালু করতে উপরের বাটনে চাপুন।"
                  );
                  status.setTextSize(14);
                  status.setTextColor(Color.DKGRAY);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(10, 4, 10, 10);

                  root.addView(
                          status,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                  );

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                          "https://pinku-ai89.github.io/Trading--ai/"
                  );

                  root.addView(
                          webView,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0,
                                  1
                          )
                  );

                  setContentView(root);

                  floatingButton.setOnClickListener(v -> {

                      if (!Settings.canDrawOverlays(this)) {

                          Toast.makeText(
                                  this,
                                  "প্রথমে Display over other apps অনুমতি দিন",
                                  Toast.LENGTH_LONG
                          ).show();

                          try {

                              Intent intent = new Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse(
                                              "package:" + getPackageName()
                                      )
                              );

                              startActivity(intent);

                          } catch (Exception e) {

                              Intent intent = new Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION
                              );

                              startActivity(intent);
                          }

                      } else {

                          startFloatingService();

                          status.setText(
                                  "✅ Floating AI Button চালু আছে"
                          );
                      }
                  });
              }

              private void startFloatingService() {

                  Intent service = new Intent(
                          this,
                          FloatingService.class
                  );

                  if (Build.VERSION.SDK_INT >= 26) {
                      startForegroundService(service);
                  } else {
                      startService(service);
                  }

                  Toast.makeText(
                          this,
                          "🤖 Floating AI চালু হয়েছে",
                          Toast.LENGTH_SHORT
                  ).show();
              }

              @Override
              protected void onResume() {
                  super.onResume();

                  if (webView != null) {
                      webView.onResume();
                  }
              }

              @Override
              protected void onPause() {

                  if (webView != null) {
                      webView.onPause();
                  }

                  super.onPause();
              }

              @Override
              public void onBackPressed() {

                  if (
                          webView != null &&
                          webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/traderpinkai/app/FloatingService.java <<'EOF'
          package com.traderpinkai.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class FloatingService extends Service {

              private WindowManager windowManager;

              private View floatingButton;
              private View signalPanel;

              private WindowManager.LayoutParams buttonParams;
              private WindowManager.LayoutParams panelParams;

              private boolean panelVisible = false;

              @Override
              public void onCreate() {
                  super.onCreate();

                  createNotificationChannel();

                  Notification notification =
                          new Notification.Builder(
                                  this,
                                  "trader_pink_ai"
                          )
                          .setContentTitle("Trader Pink AI")
                          .setContentText("Floating AI চালু আছে")
                          .setSmallIcon(
                                  android.R.drawable.ic_dialog_info
                          )
                          .setOngoing(true)
                          .build();

                  startForeground(1001, notification);

                  showFloatingButton();
              }

              private int getOverlayType() {

                  if (Build.VERSION.SDK_INT >= 26) {
                      return WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY;
                  }

                  return WindowManager.LayoutParams.TYPE_PHONE;
              }

              private void showFloatingButton() {

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  windowManager =
                          (WindowManager)
                                  getSystemService(WINDOW_SERVICE);

                  TextView button = new TextView(this);

                  button.setText("🤖");
                  button.setTextSize(25);
                  button.setGravity(Gravity.CENTER);
                  button.setTextColor(Color.WHITE);
                  button.setBackgroundColor(
                          Color.rgb(255, 79, 154)
                  );

                  button.setPadding(18, 12, 18, 12);

                  floatingButton = button;

                  buttonParams =
                          new WindowManager.LayoutParams(
                                  70,
                                  70,
                                  getOverlayType(),
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                                  PixelFormat.TRANSLUCENT
                          );

                  buttonParams.gravity =
                          Gravity.TOP | Gravity.LEFT;

                  buttonParams.x = 20;
                  buttonParams.y = 250;

                  windowManager.addView(
                          floatingButton,
                          buttonParams
                  );

                  button.setOnClickListener(v -> {

                      if (panelVisible) {
                          hideSignalPanel();
                      } else {
                          showSignalPanel();
                      }
                  });

                  enableDragging(
                          floatingButton,
                          buttonParams
                  );
              }

              private void showSignalPanel() {

                  if (signalPanel != null) {
                      return;
                  }

                  LinearLayout box =
                          new LinearLayout(this);

                  box.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  box.setPadding(
                          22, 16, 22, 16
                  );

                  box.setBackgroundColor(
                          Color.WHITE
                  );

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "🤖 Trader Pink AI"
                  );

                  title.setTextSize(18);
                  title.setTextColor(Color.BLACK);

                  TextView market =
                          new TextView(this);

                  market.setText(
                          "EURUSD • 5M"
                  );

                  market.setTextSize(15);
                  market.setTextColor(Color.DKGRAY);

                  TextView signal =
                          new TextView(this);

                  signal.setText(
                          "🟢 BUY • 80%"
                  );

                  signal.setTextSize(22);
                  signal.setTextColor(
                          Color.rgb(20, 150, 70)
                  );

                  TextView trend =
                          new TextView(this);

                  trend.setText(
                          "📈 UPTREND"
                  );

                  trend.setTextSize(15);
                  trend.setTextColor(Color.DKGRAY);

                  TextView candle =
                          new TextView(this);

                  candle.setText(
                          "⏱️ Candle: 5 Minute"
                  );

                  candle.setTextSize(14);
                  candle.setTextColor(Color.DKGRAY);

                  TextView close =
                          new TextView(this);

                  close.setText(
                          "✕ Signal বন্ধ করুন"
                  );

                  close.setTextSize(14);
                  close.setTextColor(Color.RED);
                  close.setPadding(0, 12, 0, 0);

                  box.addView(title);
                  box.addView(market);
                  box.addView(signal);
                  box.addView(trend);
                  box.addView(candle);
                  box.addView(close);

                  signalPanel = box;

                  panelParams =
                          new WindowManager.LayoutParams(
                                  WindowManager.LayoutParams.WRAP_CONTENT,
                                  WindowManager.LayoutParams.WRAP_CONTENT,
                                  getOverlayType(),
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                                  PixelFormat.TRANSLUCENT
                          );

                  panelParams.gravity =
                          Gravity.TOP | Gravity.LEFT;

                  panelParams.x =
                          buttonParams.x + 10;

                  panelParams.y =
                          buttonParams.y + 80;

                  windowManager.addView(
                          signalPanel,
                          panelParams
                  );

                  panelVisible = true;

                  close.setOnClickListener(v ->
                          hideSignalPanel()
                  );

                  enableDragging(
                          signalPanel,
                          panelParams
                  );
              }

              private void hideSignalPanel() {

                  if (
                          signalPanel != null &&
                          windowManager != null
                  ) {

                      try {
                          windowManager.removeView(
                                  signalPanel
                          );
                      } catch (Exception ignored) {
                      }
                  }

                  signalPanel = null;
                  panelVisible = false;
              }

              private void enableDragging(
                      View view,
                      WindowManager.LayoutParams params
              ) {

                  view.setOnTouchListener(
                          new View.OnTouchListener() {

                              private int initialX;
                              private int initialY;

                              private float initialTouchX;
                              private float initialTouchY;

                              private boolean moved = false;

                              @Override
                              public boolean onTouch(
                                      View v,
                                      MotionEvent event
                              ) {

                                  switch (
                                          event.getAction()
                                  ) {

                                      case MotionEvent.ACTION_DOWN:

                                          initialX = params.x;
                                          initialY = params.y;

                                          initialTouchX =
                                                  event.getRawX();

                                          initialTouchY =
                                                  event.getRawY();

                                          moved = false;

                                          return true;

                                      case MotionEvent.ACTION_MOVE:

                                          int dx =
                                                  (int)(
                                                          event.getRawX()
                                                          -
                                                          initialTouchX
                                                  );

                                          int dy =
                                                  (int)(
                                                          event.getRawY()
                                                          -
                                                          initialTouchY
                                                  );

                                          if (
                                                  Math.abs(dx) > 10 ||
                                                  Math.abs(dy) > 10
                                          ) {
                                              moved = true;
                                          }

                                          params.x =
                                                  initialX + dx;

                                          params.y =
                                                  initialY + dy;

                                          if (
                                                  windowManager != null
                                          ) {

                                              try {

                                                  windowManager.updateViewLayout(
                                                          view,
                                                          params
                                                  );

                                              } catch (Exception ignored) {
                                              }
                                          }

                                          return true;

                                      case MotionEvent.ACTION_UP:

                                          return moved;

                                  }

                                  return false;
                              }
                          }
                  );
              }

              private void createNotificationChannel() {

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel channel =
                              new NotificationChannel(
                                      "trader_pink_ai",
                                      "Trader Pink AI",
                                      NotificationManager.IMPORTANCE_LOW
                              );

                      NotificationManager manager =
                              getSystemService(
                                      NotificationManager.class
                              );

                      if (manager != null) {

                          manager.createNotificationChannel(
                                  channel
                          );
                      }
                  }
              }

              @Override
              public void onDestroy() {

                  hideSignalPanel();

                  if (
                          floatingButton != null &&
                          windowManager != null
                  ) {

                      try {

                          windowManager.removeView(
                                  floatingButton
                          );

                      } catch (Exception ignored) {
                      }
                  }

                  floatingButton = null;
                  windowManager = null;

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                      Intent intent
              ) {
                  return null;
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trader-Pink-AI-Floating-v7
          path: app/build/outputs/apk/debug/app-debug.apk
