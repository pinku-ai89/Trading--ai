name: Build Trader Pink AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android Source Files
        run: |
          mkdir -p app/src/main/java/com/traderpink/ai
          mkdir -p app/src/main/res/values

          cp android/MainActivity.java \
             app/src/main/java/com/traderpink/ai/MainActivity.java

          cp android/FloatingService.java \
             app/src/main/java/com/traderpink/ai/FloatingService.java

          cp android/AndroidManifest.xml \
             app/src/main/AndroidManifest.xml

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                     parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#ff4f9a</item>
                  <item name="android:navigationBarColor">#0b1020</item>
                  <item name="android:statusBarColor">#0b1020</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

      - name: Verify Android Files
        run: |
          echo "Checking Android files..."

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/traderpink/ai/MainActivity.java
          test -f app/src/main/java/com/traderpink/ai/FloatingService.java

          echo "All Android source files are ready."

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trader-Pink-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
