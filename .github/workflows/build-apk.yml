name: Build Trader Pink AI Floating APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Create Android project
    shell: bash
    run: |
      mkdir -p app/src/main/java/com/traderpinkai/app
      mkdir -p app/src/main/res/values

      printf '%s\n' \
      'pluginManagement {' \
      '    repositories {' \
      '        google()' \
      '        mavenCentral()' \
      '        gradlePluginPortal()' \
      '    }' \
      '}' \
      '' \
      'dependencyResolutionManagement {' \
      '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
      '    repositories {' \
      '        google()' \
      '        mavenCentral()' \
      '    }' \
      '}' \
      '' \
      'rootProject.name = "TraderPinkAI"' \
      'include(":app")' > settings.gradle

      printf '%s\n' \
      'plugins {' \
      '    id "com.android.application" version "8.7.3" apply false' \
      '}' > build.gradle

      printf '%s\n' \
      'plugins {' \
      '    id "com.android.application"' \
      '}' \
      '' \
      'android {' \
      '    namespace "com.traderpinkai.app"' \
      '    compileSdk 35' \
      '' \
      '    defaultConfig {' \
      '        applicationId "com.traderpinkai.app"' \
      '        minSdk 23' \
      '        targetSdk 35' \
      '        versionCode 14' \
      '        versionName "1.0"' \
      '    }' \
      '}' > app/build.gradle

      printf '%s\n' \
      '<resources>' \
      '    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">' \
      '        <item name="android:fontFamily">sans</item>' \
      '        <item name="android:colorAccent">#ff4fa3</item>' \
      '        <item name="android:statusBarColor">#0b1020</item>' \
      '        <item name="android:navigationBarColor">#0b1020</item>' \
      '    </style>' \
      '</resources>' > app/src/main/res/values/styles.xml

      printf '%s\n' \
      '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
      '    <uses-permission android:name="android.permission.INTERNET" />' \
      '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' \
      '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' \
      '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />' \
      '' \
      '    <application' \
      '        android:allowBackup="true"' \
      '        android:label="Trader Pink AI"' \
      '        android:theme="@style/AppTheme">' \
      '' \
      '        <activity' \
      '            android:name=".MainActivity"' \
      '            android:exported="true">' \
      '            <intent-filter>' \
      '                <action android:name="android.intent.action.MAIN" />' \
      '                <category android:name="android.intent.category.LAUNCHER" />' \
      '            </intent-filter>' \
      '        </activity>' \
      '' \
      '        <service' \
      '            android:name=".FloatingService"' \
      '            android:exported="false"' \
      '            android:foregroundServiceType="specialUse" />' \
      '' \
      '    </application>' \
      '</manifest>' > app/src/main/AndroidManifest.xml

  - name: Create MainActivity
    shell: bash
    run: |
      cat > app/src/main/java/com/traderpinkai/app/MainActivity.java <<'JAVA'
      package com.traderpinkai.app;

      import android.app.Activity;
      import android.content.Intent;
      import android.net.Uri;
      import android.os.Bundle;
      import android.provider.Settings;
      import android.view.Gravity;
      import android.widget.Button;
      import android.widget.LinearLayout;
      import android.widget.TextView;

      public class MainActivity extends Activity {

          @Override
          protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              LinearLayout layout = new LinearLayout(this);
              layout.setOrientation(LinearLayout.VERTICAL);
              layout.setGravity(Gravity.CENTER);
              layout.setPadding(30, 30, 30, 30);

              TextView title = new TextView(this);
              title.setText("🤖 Trader Pink AI");
              title.setTextSize(26);
              title.setGravity(Gravity.CENTER);

              TextView info = new TextView(this);
              info.setText(
                  "\nEUR/USD Smart Signal\n" +
                  "1 Minute • Next Candle\n\n" +
                  "Floating Bot চালু করতে নিচের বাটন চাপুন."
              );
              info.setTextSize(18);
              info.setGravity(Gravity.CENTER);

              Button permission = new Button(this);
              permission.setText("⚙️ Floating Permission");

              Button start = new Button(this);
              start.setText("🤖 START FLOATING BOT");

              layout.addView(title);
              layout.addView(info);
              layout.addView(permission);
              layout.addView(start);

              setContentView(layout);

              permission.setOnClickListener(v -> {
                  Intent intent = new Intent(
                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                      Uri.parse("package:" + getPackageName())
                  );
                  startActivity(intent);
              });

              start.setOnClickListener(v -> {

                  if (!Settings.canDrawOverlays(this)) {
                      Intent intent = new Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:" + getPackageName())
                      );
                      startActivity(intent);
                      return;
                  }

                  Intent serviceIntent =
                      new Intent(this, FloatingService.class);

                  startForegroundService(serviceIntent);
              });
          }
      }
      JAVA

  - name: Create FloatingService
    shell: bash
    run: |
      cat > app/src/main/java/com/traderpinkai/app/FloatingService.java <<'JAVA'
      package com.traderpinkai.app;

      import android.app.Notification;
      import android.app.NotificationChannel;
      import android.app.NotificationManager;
      import android.app.Service;
      import android.content.Intent;
      import android.graphics.Color;
      import android.graphics.PixelFormat;
      import android.os.Build;
      import android.os.Handler;
      import android.os.IBinder;
      import android.view.Gravity;
      import android.view.WindowManager;
      import android.widget.LinearLayout;
      import android.widget.TextView;

      import org.json.JSONObject;

      import java.io.BufferedReader;
      import java.io.InputStreamReader;
      import java.net.HttpURLConnection;
      import java.net.URL;

      public class FloatingService extends Service {

          private WindowManager windowManager;
          private LinearLayout box;

          private TextView signal;
          private TextView confidence;
          private TextView trend;
          private TextView candle;

          private final Handler handler = new Handler();

          private static final String API =
              "https://crimson-grass-f881.bijondebnath51.workers.dev/";

          private final Runnable updater = new Runnable() {
              @Override
              public void run() {
                  updateSignal();
                  handler.postDelayed(this, 30000);
              }
          };

          @Override
          public void onCreate() {
              super.onCreate();

              createNotification();
              createFloatingView();

              handler.post(updater);
          }

          private void createNotification() {

              String channelId = "trader_pink_ai";

              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

                  NotificationChannel channel =
                      new NotificationChannel(
                          channelId,
                          "Trader Pink AI",
                          NotificationManager.IMPORTANCE_LOW
                      );

                  NotificationManager manager =
                      getSystemService(NotificationManager.class);

                  manager.createNotificationChannel(channel);
              }

              Notification.Builder builder;

              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                  builder = new Notification.Builder(this, channelId);
              } else {
                  builder = new Notification.Builder(this);
              }

              builder
                  .setContentTitle("Trader Pink AI")
                  .setContentText("EUR/USD Signal চলছে")
                  .setSmallIcon(android.R.drawable.ic_dialog_info);

              startForeground(1001, builder.build());
          }

          private TextView makeText(String text, int size) {

              TextView t = new TextView(this);

              t.setText(text);
              t.setTextColor(Color.WHITE);
              t.setTextSize(size);
              t.setPadding(4, 4, 4, 4);

              return t;
          }

          private void createFloatingView() {

              windowManager =
                  (WindowManager) getSystemService(WINDOW_SERVICE);

              box = new LinearLayout(this);
              box.setOrientation(LinearLayout.VERTICAL);
              box.setPadding(22, 18, 22, 18);
              box.setBackgroundColor(Color.rgb(11, 16, 32));

              TextView title =
                  makeText("🤖 Trader Pink AI", 18);

              TextView market =
                  makeText("EURUSD • 1 MIN", 15);

              candle =
                  makeText("Closed Candle: --", 13);

              signal =
                  makeText("SIGNAL: WAIT", 24);

              confidence =
                  makeText("Confidence: --", 16);

              trend =
                  makeText("Trend: --", 14);

              box.addView(title);
              box.addView(market);
              box.addView(candle);
              box.addView(signal);
              box.addView(confidence);
              box.addView(trend);

              WindowManager.LayoutParams params =
                  new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  );

              params.gravity =
                  Gravity.TOP | Gravity.RIGHT;

              params.x = 15;
              params.y = 120;

              windowManager.addView(box, params);
          }

          private void updateSignal() {

              new Thread(() -> {

                  HttpURLConnection connection = null;

                  try {

                      URL url = new URL(API);

                      connection =
                          (HttpURLConnection) url.openConnection();

                      connection.setRequestMethod("GET");
                      connection.setConnectTimeout(10000);
                      connection.setReadTimeout(10000);

                      BufferedReader reader =
                          new BufferedReader(
                              new InputStreamReader(
                                  connection.getInputStream()
                              )
                          );

                      StringBuilder result =
                          new StringBuilder();

                      String line;

                      while ((line = reader.readLine()) != null) {
                          result.append(line);
                      }

                      reader.close();

                      JSONObject data =
                          new JSONObject(result.toString());

                      String finalSignal =
                          data.optString("signal", "WAIT");

                      int conf =
                          data.optInt("confidence", 0);

                      String finalTrend =
                          data.optString(
                              "trend",
                              "SIDEWAYS"
                          );

                      String candleTime =
                          data.optString(
                              "closed_candle_time",
                              "--"
                          );

                      handler.post(() -> {

                          signal.setText(
                              "SIGNAL: " + finalSignal
                          );

                          confidence.setText(
                              "Confidence: " + conf + "%"
                          );

                          trend.setText(
                              "Trend: " + finalTrend
                          );

                          candle.setText(
                              "Closed Candle: " +
                              candleTime
                          );

                          if (finalSignal.equalsIgnoreCase("BUY")) {

                              signal.setTextColor(
                                  Color.rgb(0, 220, 120)
                              );

                          } else if (
                              finalSignal.equalsIgnoreCase("SELL")
                          ) {

                              signal.setTextColor(
                                  Color.rgb(255, 80, 100)
                              );

                          } else {

                              signal.setTextColor(
                                  Color.WHITE
                              );
                          }
                      });

                  } catch (Exception e) {

                      handler.post(() -> {

                          signal.setText("SIGNAL: WAIT");
                          confidence.setText(
                              "Confidence: 0%"
                          );
                          trend.setText("Trend: OFFLINE");
                          candle.setText(
                              "Closed Candle: --"
                          );
                      });

                  } finally {

                      if (connection != null) {
                          connection.disconnect();
                      }
                  }

              }).start();
          }

          @Override
          public int onStartCommand(
              Intent intent,
              int flags,
              int startId
          ) {
              return START_STICKY;
          }

          @Override
          public void onDestroy() {

              handler.removeCallbacks(updater);

              if (windowManager != null &&
                  box != null) {

                  windowManager.removeView(box);
              }

              super.onDestroy();
          }

          @Override
          public IBinder onBind(Intent intent) {
              return null;
          }
      }
      JAVA

  - name: Build APK
    shell: bash
    run: |
      wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
      unzip -q gradle-8.9-bin.zip
      export PATH="$PWD/gradle-8.9/bin:$PATH"
      gradle assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Trader-Pink-AI-Floating-v14
      path: app/build/outputs/apk/debug/app-debug.apk
