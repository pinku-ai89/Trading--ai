name: Build Trader Pink AI Floating APK v9

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/traderpinkai/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "TraderPinkAI"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.traderpinkai.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.traderpinkai.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 9
                  versionName '9.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#ff4f9a</item>
                  <item name="android:statusBarColor">#ff4f9a</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Trader Pink AI"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".FloatingService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">

                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Trader Pink AI floating trading assistant"/>

                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/traderpinkai/app/MainActivity.java <<'EOF'
          package com.traderpinkai.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private WebView webView;
              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.WHITE);

                  TextView title = new TextView(this);
                  title.setText("🤖 Trader Pink AI v9.0");
                  title.setTextSize(22);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(10, 18, 10, 10);

                  root.addView(title,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  Button floatingButton = new Button(this);
                  floatingButton.setText("🟣 FLOATING BOT চালু করুন");
                  floatingButton.setTextSize(17);

                  root.addView(floatingButton,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  status = new TextView(this);
                  status.setText("Overlay permission Allow করুন।");
                  status.setTextSize(14);
                  status.setTextColor(Color.DKGRAY);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(10, 4, 10, 10);

                  root.addView(status,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://pinku-ai89.github.io/Trading--ai/");

                  root.addView(webView,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1));

                  setContentView(root);

                  floatingButton.setOnClickListener(v -> {

                      if (!Settings.canDrawOverlays(this)) {

                          status.setText("⚠️ Overlay permission Allow করুন।");

                          try {
                              Intent intent = new Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + getPackageName())
                              );
                              startActivity(intent);
                          } catch (Exception e) {
                              startActivity(new Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION));
                          }

                      } else {
                          startFloatingService();
                          status.setText("✅ Floating Bot চালু আছে");
                      }
                  });
              }

              private void startFloatingService() {

                  Intent service = new Intent(this, FloatingService.class);

                  if (Build.VERSION.SDK_INT >= 26) {
                      startForegroundService(service);
                  } else {
                      startService(service);
                  }

                  Toast.makeText(
                      this,
                      "Floating Bot চালু হয়েছে",
                      Toast.LENGTH_SHORT
                  ).show();
              }

              @Override
              protected void onResume() {
                  super.onResume();

                  if (webView != null) {
                      webView.onResume();
                  }

                  if (Settings.canDrawOverlays(this) && status != null) {
                      status.setText(
                          "✅ Permission চালু আছে। Floating Bot চালু করুন।"
                      );
                  }
              }

              @Override
              protected void onPause() {
                  if (webView != null) {
                      webView.onPause();
                  }
                  super.onPause();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/traderpinkai/app/FloatingService.java <<'EOF'
          package com.traderpinkai.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class FloatingService extends Service {

              private WindowManager windowManager;
              private View floatingView;
              private WindowManager.LayoutParams params;

              private TextView title;
              private TextView market;
              private TextView signal;
              private TextView candle;
              private TextView trend;
              private TextView status;
              private Button nextButton;

              private final Handler handler = new Handler();

              private static final String API =
                  "https://bijondebnath51.workers.dev/analyze";

              private static final String SYMBOL = "EURUSD";
              private static final String TIMEFRAME = "5m";

              private boolean scanning = false;

              private final Runnable autoScanner = new Runnable() {
                  @Override
                  public void run() {
                      updateSignal();
                      handler.postDelayed(this, 30000);
                  }
              };

              @Override
              public void onCreate() {
                  super.onCreate();

                  createNotificationChannel();

                  Notification notification =
                      new Notification.Builder(this, "trader_pink_ai")
                          .setContentTitle("Trader Pink AI")
                          .setContentText("Live Signal Bot চালু আছে")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setOngoing(true)
                          .build();

                  startForeground(1001, notification);

                  showFloatingWindow();

                  handler.post(autoScanner);
              }

              private void showFloatingWindow() {

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  windowManager =
                      (WindowManager)getSystemService(WINDOW_SERVICE);

                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(18, 12, 18, 12);
                  box.setBackgroundColor(Color.WHITE);

                  title = new TextView(this);
                  title.setText("🤖 Trader Pink AI");
                  title.setTextSize(17);
                  title.setTextColor(Color.BLACK);

                  market = new TextView(this);
                  market.setText("EURUSD • 5M");
                  market.setTextSize(13);
                  market.setTextColor(Color.DKGRAY);

                  signal = new TextView(this);
                  signal.setText("⏳ WAIT • --%");
                  signal.setTextSize(20);
                  signal.setTextColor(Color.rgb(220, 140, 20));
                  signal.setPadding(0, 5, 0, 0);

                  candle = new TextView(this);
                  candle.setText("⏱ --");
                  candle.setTextSize(12);
                  candle.setTextColor(Color.DKGRAY);

                  trend = new TextView(this);
                  trend.setText("📊 --");
                  trend.setTextSize(13);
                  trend.setTextColor(Color.DKGRAY);

                  status = new TextView(this);
                  status.setText("🔄 Scanning...");
                  status.setTextSize(11);
                  status.setTextColor(Color.GRAY);

                  nextButton = new Button(this);
                  nextButton.setText("◯ NEXT SIGNAL");
                  nextButton.setTextSize(12);
                  nextButton.setAllCaps(false);

                  box.addView(title);
                  box.addView(market);
                  box.addView(signal);
                  box.addView(candle);
                  box.addView(trend);
                  box.addView(status);
                  box.addView(nextButton);

                  int type =
                      Build.VERSION.SDK_INT >= 26
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;

                  params = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  );

                  params.gravity = Gravity.TOP | Gravity.LEFT;
                  params.x = 15;
                  params.y = 180;

                  floatingView = box;

                  windowManager.addView(floatingView, params);

                  nextButton.setOnClickListener(v -> {
                      updateSignal();
                  });

                  box.setOnTouchListener(new View.OnTouchListener() {

                      private int initialX;
                      private int initialY;
                      private float initialTouchX;
                      private float initialTouchY;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {

                          switch (event.getAction()) {

                              case MotionEvent.ACTION_DOWN:
                                  initialX = params.x;
                                  initialY = params.y;
                                  initialTouchX = event.getRawX();
                                  initialTouchY = event.getRawY();
                                  return false;

                              case MotionEvent.ACTION_MOVE:
                                  params.x = initialX +
                                      (int)(event.getRawX() - initialTouchX);

                                  params.y = initialY +
                                      (int)(event.getRawY() - initialTouchY);

                                  windowManager.updateViewLayout(
                                      floatingView, params);

                                  return true;
                          }

                          return false;
                      }
                  });
              }

              private void updateSignal() {

                  if (scanning) return;

                  scanning = true;

                  handler.post(() -> {
                      status.setText("🔎 Searching strong setup...");
                      nextButton.setText("⏳ SCANNING...");
                  });

                  new Thread(() -> {

                      HttpURLConnection connection = null;

                      try {

                          URL url = new URL(
                              API +
                              "?symbol=" +
                              SYMBOL +
                              "&timeframe=" +
                              TIMEFRAME
                          );

                          connection =
                              (HttpURLConnection)url.openConnection();

                          connection.setRequestMethod("GET");
                          connection.setConnectTimeout(10000);
                          connection.setReadTimeout(10000);
                          connection.setRequestProperty(
                              "Accept", "application/json");

                          int responseCode =
                              connection.getResponseCode();

                          if (responseCode < 200 ||
                              responseCode >= 300) {

                              showError("⚠️ API unavailable");
                              return;
                          }

                          BufferedReader reader =
                              new BufferedReader(
                                  new InputStreamReader(
                                      connection.getInputStream()
                                  )
                              );

                          StringBuilder result =
                              new StringBuilder();

                          String line;

                          while ((line = reader.readLine()) != null) {
                              result.append(line);
                          }

                          reader.close();

                          JSONObject json =
                              new JSONObject(result.toString());

                          String direction =
                              getNestedString(
                                  json,
                                  "signal",
                                  "direction",
                                  "WAIT"
                              ).toUpperCase();

                          String confidence =
                              getNestedString(
                                  json,
                                  "signal",
                                  "confidence",
                                  "--"
                              ).replace("%", "");

                          String trendValue =
                              getNestedString(
                                  json,
                                  "analysis",
                                  "trend",
                                  "--"
                              ).toUpperCase();

                          String strengthValue =
                              getNestedString(
                                  json,
                                  "analysis",
                                  "market_strength",
                                  "--"
                              ).toUpperCase();

                          String candleTime =
                              findFirst(
                                  json,
                                  "candle_time",
                                  "candleTime",
                                  "timestamp",
                                  "time",
                                  "datetime"
                              );

                          if (candleTime == null ||
                              candleTime.equals("--")) {
                              candleTime = "Live";
                          }

                          final String d = direction;
                          final String c = confidence;
                          final String t = trendValue;
                          final String s = strengthValue;
                          final String ct = candleTime;

                          handler.post(() -> {

                              signal.setText(
                                  getSignalEmoji(d) +
                                  " " +
                                  d +
                                  " " +
                                  c +
                                  "%"
                              );

                              candle.setText(
                                  "⏱ " + ct
                              );

                              trend.setText(
                                  getTrendEmoji(t) +
                                  " " +
                                  t
                              );

                              if (isStrong(d, c, s)) {

                                  status.setText(
                                      "🟢 Strong setup found"
                                  );

                              } else {

                                  status.setText(
                                      "⏳ WAIT • Weak setup"
                                  );

                                  signal.setText(
                                      "⏳ WAIT • " + c + "%"
                                  );
                              }

                              nextButton.setText(
                                  "◯ NEXT SIGNAL"
                              );

                              setSignalColor(d);

                              scanning = false;
                          });

                      } catch (Exception e) {

                          showError("⚠️ Signal update হয়নি");

                      } finally {

                          if (connection != null) {
                              connection.disconnect();
                          }

                          scanning = false;
                      }

                  }).start();
              }

              private boolean isStrong(
                  String direction,
                  String confidence,
                  String strength
              ) {

                  try {

                      int score =
                          Integer.parseInt(
                              confidence
                                  .replace("%", "")
                                  .trim()
                          );

                      boolean directionOK =
                          direction.contains("BUY") ||
                          direction.contains("SELL");

                      boolean strengthOK =
                          strength.contains("STRONG");

                      return directionOK &&
                             score >= 80 &&
                             strengthOK;

                  } catch (Exception e) {
                      return false;
                  }
              }

              private void showError(String message) {

                  handler.post(() -> {

                      if (status != null) {
                          status.setText(message);
                      }

                      if (nextButton != null) {
                          nextButton.setText("◯ NEXT SIGNAL");
                      }

                      scanning = false;
                  });
              }

              private String getNestedString(
                  JSONObject object,
                  String parent,
                  String key,
                  String fallback
              ) {

                  try {

                      if (object.has(parent) &&
                          object.get(parent) instanceof JSONObject) {

                          JSONObject child =
                              object.getJSONObject(parent);

                          if (child.has(key)) {
                              return String.valueOf(
                                  child.get(key)
                              );
                          }
                      }

                  } catch (Exception ignored) {
                  }

                  return fallback;
              }

              private String findFirst(
                  JSONObject json,
                  String... keys
              ) {

                  for (String key : keys) {

                      try {

                          if (json.has(key)) {

                              Object value = json.get(key);

                              if (value != null &&
                                  !String.valueOf(value)
                                      .equals("null")) {

                                  return String.valueOf(value);
                              }
                          }

                      } catch (Exception ignored) {
                      }
                  }

                  return "--";
              }

              private String getSignalEmoji(
                  String direction
              ) {

                  if (direction.contains("BUY")) {
                      return "🟢";
                  }

                  if (direction.contains("SELL")) {
                      return "🔴";
                  }

                  return "⏳";
              }

              private String getTrendEmoji(
                  String value
              ) {

                  if (value.contains("UP") ||
                      value.contains("BULL")) {
                      return "📈";
                  }

                  if (value.contains("DOWN") ||
                      value.contains("BEAR")) {
                      return "📉";
                  }

                  return "📊";
              }

              private void setSignalColor(
                  String direction
              ) {

                  if (direction.contains("BUY")) {

                      signal.setTextColor(
                          Color.rgb(0, 150, 70)
                      );

                  } else if (direction.contains("SELL")) {

                      signal.setTextColor(Color.RED);

                  } else {

                      signal.setTextColor(
                          Color.rgb(220, 140, 20)
                      );
                  }
              }

              private void createNotificationChannel() {

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel channel =
                          new NotificationChannel(
                              "trader_pink_ai",
                              "Trader Pink AI",
                              NotificationManager.IMPORTANCE_LOW
                          );

                      NotificationManager manager =
                          getSystemService(
                              NotificationManager.class
                          );

                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }

              @Override
              public void onDestroy() {

                  handler.removeCallbacks(autoScanner);

                  if (floatingView != null &&
                      windowManager != null) {

                      try {
                          windowManager.removeView(floatingView);
                      } catch (Exception ignored) {
                      }
                  }

                  floatingView = null;
                  windowManager = null;

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trader-Pink-AI-Floating-v9
          path: app/build/outputs/apk/debug/app-debug.apk
