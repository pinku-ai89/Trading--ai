name: Build Trader Pink AI Floating APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/traderpinkai/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "TraderPinkAI"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.traderpinkai.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.traderpinkai.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 8
                  versionName '8.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#ff4f9a</item>
                  <item name="android:statusBarColor">#ff4f9a</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Trader Pink AI"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".FloatingService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">

                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Trader Pink AI floating trading assistant"/>

                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/traderpinkai/app/MainActivity.java <<'EOF'
          package com.traderpinkai.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private WebView webView;
              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.WHITE);

                  TextView title = new TextView(this);
                  title.setText("🤖 Trader Pink AI v8.0");
                  title.setTextSize(22);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(10, 18, 10, 10);

                  root.addView(
                      title,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  );

                  Button floatingButton = new Button(this);
                  floatingButton.setText("🟣 FLOATING BOT চালু করুন");
                  floatingButton.setTextSize(17);

                  root.addView(
                      floatingButton,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  );

                  status = new TextView(this);
                  status.setText(
                      "প্রথমে বাটনে চাপুন। তারপর Overlay permission Allow করুন।"
                  );
                  status.setTextSize(14);
                  status.setTextColor(Color.DKGRAY);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(10, 4, 10, 10);

                  root.addView(
                      status,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  );

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                      "https://pinku-ai89.github.io/Trading--ai/"
                  );

                  root.addView(
                      webView,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1
                      )
                  );

                  setContentView(root);

                  floatingButton.setOnClickListener(v -> {

                      if (!Settings.canDrawOverlays(this)) {

                          status.setText(
                              "⚠️ এখন Overlay permission Allow করুন।"
                          );

                          try {
                              Intent intent = new Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse(
                                      "package:" + getPackageName()
                                  )
                              );

                              startActivity(intent);

                          } catch (Exception e) {

                              startActivity(
                                  new Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION
                                  )
                              );
                          }

                      } else {

                          startFloatingService();

                          status.setText(
                              "✅ Floating Bot চালু আছে"
                          );
                      }
                  });
              }

              private void startFloatingService() {

                  Intent service = new Intent(
                      this,
                      FloatingService.class
                  );

                  if (Build.VERSION.SDK_INT >= 26) {
                      startForegroundService(service);
                  } else {
                      startService(service);
                  }

                  Toast.makeText(
                      this,
                      "Floating Bot চালু হয়েছে",
                      Toast.LENGTH_SHORT
                  ).show();
              }

              @Override
              protected void onResume() {
                  super.onResume();

                  if (webView != null) {
                      webView.onResume();
                  }

                  if (Settings.canDrawOverlays(this)) {
                      if (status != null) {
                          status.setText(
                              "✅ Overlay permission চালু আছে। Floating Bot চালু করুন।"
                          );
                      }
                  }
              }

              @Override
              protected void onPause() {

                  if (webView != null) {
                      webView.onPause();
                  }

                  super.onPause();
              }

              @Override
              public void onBackPressed() {

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/traderpinkai/app/FloatingService.java <<'EOF'
          package com.traderpinkai.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class FloatingService extends Service {

              private WindowManager windowManager;
              private View floatingView;
              private WindowManager.LayoutParams params;

              private TextView title;
              private TextView market;
              private TextView candleTime;
              private TextView signal;
              private TextView strength;
              private TextView trend;
              private TextView updateStatus;
              private TextView open;
              private TextView close;

              private final Handler handler = new Handler();

              private static final String API =
                      "https://bijondebnath51.workers.dev/analyze";

              private static final String SYMBOL = "EURUSD";

              private static final String TIMEFRAME = "1m";

              private final Runnable updater = new Runnable() {
                  @Override
                  public void run() {

                      updateSignal();

                      handler.postDelayed(
                          this,
                          30000
                      );
                  }
              };

              @Override
              public void onCreate() {
                  super.onCreate();

                  createNotificationChannel();

                  Notification notification =
                      new Notification.Builder(
                          this,
                          "trader_pink_ai"
                      )
                      .setContentTitle("Trader Pink AI")
                      .setContentText(
                          "Live Signal Bot চালু আছে"
                      )
                      .setSmallIcon(
                          android.R.drawable.ic_dialog_info
                      )
                      .setOngoing(true)
                      .build();

                  startForeground(
                      1001,
                      notification
                  );

                  showFloatingWindow();

                  handler.post(updater);
              }

              private void showFloatingWindow() {

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  windowManager =
                      (WindowManager)
                          getSystemService(
                              WINDOW_SERVICE
                          );

                  LinearLayout box =
                      new LinearLayout(this);

                  box.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  box.setPadding(
                      24, 16, 24, 16
                  );

                  box.setBackgroundColor(
                      Color.WHITE
                  );

                  title = new TextView(this);
                  title.setText(
                      "🤖 Trader Pink AI"
                  );
                  title.setTextSize(18);
                  title.setTextColor(Color.BLACK);

                  market = new TextView(this);
                  market.setText(
                      "Market: EURUSD • 1M"
                  );
                  market.setTextSize(15);
                  market.setTextColor(Color.DKGRAY);

                  candleTime = new TextView(this);
                  candleTime.setText(
                      "🕐 Candle Time: Loading..."
                  );
                  candleTime.setTextSize(14);
                  candleTime.setTextColor(Color.DKGRAY);

                  signal = new TextView(this);
                  signal.setText(
                      "⏳ WAIT • --%"
                  );
                  signal.setTextSize(21);
                  signal.setTextColor(
                      Color.rgb(220, 140, 20)
                  );

                  strength = new TextView(this);
                  strength.setText(
                      "💪 Strength: --"
                  );
                  strength.setTextSize(14);
                  strength.setTextColor(Color.DKGRAY);

                  trend = new TextView(this);
                  trend.setText(
                      "📊 Trend: --"
                  );
                  trend.setTextSize(14);
                  trend.setTextColor(Color.DKGRAY);

                  updateStatus = new TextView(this);
                  updateStatus.setText(
                      "🔄 Live analysis চলছে..."
                  );
                  updateStatus.setTextSize(12);
                  updateStatus.setTextColor(Color.GRAY);

                  open = new TextView(this);
                  open.setText(
                      "📈 অ্যাপ খুলুন"
                  );
                  open.setTextSize(15);
                  open.setTextColor(
                      Color.rgb(30, 100, 200)
                  );

                  close = new TextView(this);
                  close.setText(
                      "✕ বন্ধ"
                  );
                  close.setTextSize(14);
                  close.setTextColor(Color.RED);

                  box.addView(title);
                  box.addView(market);
                  box.addView(candleTime);
                  box.addView(signal);
                  box.addView(strength);
                  box.addView(trend);
                  box.addView(updateStatus);
                  box.addView(open);
                  box.addView(close);

                  int type =
                      Build.VERSION.SDK_INT >= 26
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;

                  params =
                      new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          type,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      );

                  params.gravity =
                      Gravity.TOP | Gravity.LEFT;

                  params.x = 20;
                  params.y = 180;

                  floatingView = box;

                  windowManager.addView(
                      floatingView,
                      params
                  );

                  box.setOnTouchListener(
                      new View.OnTouchListener() {

                          private int initialX;
                          private int initialY;
                          private float initialTouchX;
                          private float initialTouchY;

                          @Override
                          public boolean onTouch(
                              View v,
                              MotionEvent event
                          ) {

                              switch (
                                  event.getAction()
                              ) {

                                  case MotionEvent.ACTION_DOWN:

                                      initialX = params.x;
                                      initialY = params.y;

                                      initialTouchX =
                                          event.getRawX();

                                      initialTouchY =
                                          event.getRawY();

                                      return true;

                                  case MotionEvent.ACTION_MOVE:

                                      params.x =
                                          initialX +
                                          (int)(
                                              event.getRawX()
                                              - initialTouchX
                                          );

                                      params.y =
                                          initialY +
                                          (int)(
                                              event.getRawY()
                                              - initialTouchY
                                          );

                                      windowManager.updateViewLayout(
                                          floatingView,
                                          params
                                      );

                                      return true;
                              }

                              return false;
                          }
                      }
                  );

                  open.setOnClickListener(v -> {

                      Intent intent =
                          new Intent(
                              this,
                              MainActivity.class
                          );

                      intent.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK
                      );

                      startActivity(intent);
                  });

                  close.setOnClickListener(
                      v -> stopSelf()
                  );
              }

              private void updateSignal() {

                  new Thread(() -> {

                      HttpURLConnection connection = null;

                      try {

                          String urlString =
                              API +
                              "?symbol=" +
                              SYMBOL +
                              "&timeframe=" +
                              TIMEFRAME;

                          URL url =
                              new URL(urlString);

                          connection =
                              (HttpURLConnection)
                                  url.openConnection();

                          connection.setRequestMethod(
                              "GET"
                          );

                          connection.setConnectTimeout(
                              10000
                          );

                          connection.setReadTimeout(
                              10000
                          );

                          connection.setRequestProperty(
                              "Accept",
                              "application/json"
                          );

                          int responseCode =
                              connection.getResponseCode();

                          InputStream stream;

                          if (responseCode >= 200 &&
                              responseCode < 300) {

                              stream =
                                  connection.getInputStream();

                          } else {

                              stream =
                                  connection.getErrorStream();
                          }

                          BufferedReader reader =
                              new BufferedReader(
                                  new InputStreamReader(
                                      stream
                                  )
                              );

                          StringBuilder result =
                              new StringBuilder();

                          String line;

                          while (
                              (line = reader.readLine())
                                  != null
                          ) {
                              result.append(line);
                          }

                          reader.close();

                          if (
                              responseCode < 200 ||
                              responseCode >= 300
                          ) {

                              postError(
                                  "API Error: " +
                                  responseCode
                              );

                              return;
                          }

                          JSONObject json =
                              new JSONObject(
                                  result.toString()
                              );

                          String direction =
                              getNestedString(
                                  json,
                                  "signal",
                                  "direction",
                                  "WAIT"
                              );

                          String confidence =
                              getNestedValue(
                                  json,
                                  "signal",
                                  "confidence",
                                  "--"
                              );

                          String trendValue =
                              getNestedString(
                                  json,
                                  "analysis",
                                  "trend",
                                  "--"
                              );

                          String strengthValue =
                              getNestedString(
                                  json,
                                  "analysis",
                                  "market_strength",
                                  "--"
                              );

                          String candle =
                              findFirst(
                                  json,
                                  "candle_time",
                                  "candleTime",
                                  "timestamp",
                                  "time",
                                  "datetime"
                              );

                          if (
                              candle == null ||
                              candle.equals("--")
                          ) {

                              candle =
                                  "Bangladesh Time";
                          }

                          final String finalDirection =
                              direction.toUpperCase();

                          final String finalConfidence =
                              confidence;

                          final String finalTrend =
                              trendValue.toUpperCase();

                          final String finalStrength =
                              strengthValue.toUpperCase();

                          final String finalCandle =
                              candle;

                          handler.post(() -> {

                              market.setText(
                                  "Market: " +
                                  SYMBOL +
                                  " • " +
                                  TIMEFRAME.toUpperCase()
                              );

                              candleTime.setText(
                                  "🕐 Candle Time: " +
                                  finalCandle
                              );

                              signal.setText(
                                  getSignalEmoji(
                                      finalDirection
                                  ) +
                                  " " +
                                  finalDirection +
                                  " • " +
                                  finalConfidence +
                                  "%"
                              );

                              strength.setText(
                                  "💪 Strength: " +
                                  finalStrength
                              );

                              trend.setText(
                                  getTrendEmoji(
                                      finalTrend
                                  ) +
                                  " Trend: " +
                                  finalTrend
                              );

                              updateStatus.setText(
                                  "🟢 Live • প্রতি 30 সেকেন্ডে update"
                              );

                              setSignalTextColor(
                                  finalDirection
                              );
                          });

                      } catch (Exception e) {

                          postError(
                              "⚠️ Live data update হয়নি"
                          );

                      } finally {

                          if (connection != null) {
                              connection.disconnect();
                          }
                      }

                  }).start();
              }

              private void postError(
                  final String message
              ) {

                  handler.post(() -> {

                      if (updateStatus != null) {

                          updateStatus.setText(
                              message
                          );
                      }
                  });
              }

              private String getNestedString(
                  JSONObject object,
                  String parent,
                  String key,
                  String fallback
              ) {

                  try {

                      if (
                          object.has(parent) &&
                          object.get(parent) instanceof JSONObject
                      ) {

                          JSONObject child =
                              object.getJSONObject(parent);

                          if (child.has(key)) {

                              Object value =
                                  child.get(key);

                              return String.valueOf(
                                  value
                              );
                          }
                      }

                  } catch (Exception ignored) {
                  }

                  return fallback;
              }

              private String getNestedValue(
                  JSONObject object,
                  String parent,
                  String key,
                  String fallback
              ) {

                  String value =
                      getNestedString(
                          object,
                          parent,
                          key,
                          fallback
                      );

                  value =
                      value.replace(
                          "%",
                          ""
                      );

                  return value;
              }

              private String findFirst(
                  JSONObject json,
                  String... keys
              ) {

                  for (String key : keys) {

                      try {

                          if (json.has(key)) {

                              Object value =
                                  json.get(key);

                              if (
                                  value != null &&
                                  !String.valueOf(
                                      value
                                  ).equals("null")
                              ) {

                                  return String.valueOf(
                                      value
                                  );
                              }
                          }

                      } catch (Exception ignored) {
                      }
                  }

                  return "--";
              }

              private String getSignalEmoji(
                  String direction
              ) {

                  if (
                      direction.contains("BUY")
                  ) {
                      return "🟢";
                  }

                  if (
                      direction.contains("SELL")
                  ) {
                      return "🔴";
                  }

                  return "⏳";
              }

              private String getTrendEmoji(
                  String trendValue
              ) {

                  String value =
                      trendValue.toUpperCase();

                  if (
                      value.contains("UP") ||
                      value.contains("BULL")
                  ) {
                      return "📈";
                  }

                  if (
                      value.contains("DOWN") ||
                      value.contains("BEAR")
                  ) {
                      return "📉";
                  }

                  return "📊";
              }

              private void setSignalTextColor(
                  String direction
              ) {

                  if (
                      direction.contains("BUY")
                  ) {

                      signal.setTextColor(
                          Color.rgb(
                              0, 150, 70
                          )
                      );

                  } else if (
                      direction.contains("SELL")
                  ) {

                      signal.setTextColor(
                          Color.RED
                      );

                  } else {

                      signal.setTextColor(
                          Color.rgb(
                              220, 140, 20
                          )
                      );
                  }
              }

              private void createNotificationChannel() {

                  if (
                      Build.VERSION.SDK_INT >= 26
                  ) {

                      NotificationChannel channel =
                          new NotificationChannel(
                              "trader_pink_ai",
                              "Trader Pink AI",
                              NotificationManager
                                  .IMPORTANCE_LOW
                          );

                      NotificationManager manager =
                          getSystemService(
                              NotificationManager.class
                          );

                      if (manager != null) {

                          manager.createNotificationChannel(
                              channel
                          );
                      }
                  }
              }

              @Override
              public void onDestroy() {

                  handler.removeCallbacks(
                      updater
                  );

                  if (
                      floatingView != null &&
                      windowManager != null
                  ) {

                      try {

                          windowManager.removeView(
                              floatingView
                          );

                      } catch (Exception ignored) {
                      }
                  }

                  floatingView = null;
                  windowManager = null;

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                  Intent intent
              ) {
                  return null;
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trader-Pink-AI-Floating-v8
          path: app/build/outputs/apk/debug/app-debug.apk
